<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小岛的工作台 · My Pastel Semester</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小岛的工作台">
<meta name="theme-color" content="#e879a6">
<style>
:root{
  --bg:#fdf1f6; --panel:linear-gradient(145deg,#fff8fb,#ffe9f3); --ink:#6b4a5a; --ink2:#b08fa0; --line:#f6dce7;
  --accent:#e879a6; --accent2:#f2a5c4; --accent-deep:#d15c8f;
  --ok:#d15c8f; --warn:#dfa17c; --danger:#d96d85; --study:#9d8cd2;
  --r:18px;
  --neu:8px 8px 18px rgba(214,138,172,.18),-8px -8px 18px rgba(255,255,255,.95);
  --neu-sm:4px 4px 10px rgba(214,138,172,.16),-4px -4px 10px rgba(255,255,255,.9);
  --neu-in:inset 3px 3px 6px rgba(214,138,172,.14),inset -3px -3px 6px rgba(255,255,255,.9);
  --shadow:var(--neu);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);font-size:14px;line-height:1.6;
  background-color:var(--bg);
  background-image:url('bg.png');
  background-size:cover;background-position:center;background-attachment:fixed;background-repeat:no-repeat;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:#fff3f8;border:1px solid #f9e2ec;border-radius:12px;padding:8px 12px;width:100%;outline:none;transition:box-shadow .18s;box-shadow:var(--neu-in)}
input:focus,select:focus,textarea:focus{box-shadow:var(--neu-in),0 0 0 3px rgba(232,121,166,.16)}
label{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px}
header{background:rgba(255,242,249,.72);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.65);box-shadow:0 4px 18px rgba(214,138,172,.12);padding:13px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.logo{font-size:18px;font-weight:700;display:flex;align-items:center;gap:9px;letter-spacing:.5px}
.logo .ic{width:22px;height:22px;color:var(--accent)}
.logo small{font-size:10.5px;font-weight:400;color:var(--ink2);letter-spacing:1.5px;margin-top:3px}
.seminfo{font-size:12px;color:var(--ink2)}
nav{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
nav button{padding:7px 15px;border-radius:999px;color:var(--ink2);font-weight:500;transition:background .18s,color .18s;display:inline-flex;align-items:center;gap:6px}
nav button .ic{width:15px;height:15px}
nav button:hover{background:rgba(255,255,255,.75);color:var(--accent-deep)}
nav button.on{background:linear-gradient(145deg,#f28ab4,#e0699c);color:#fff;box-shadow:4px 4px 10px rgba(214,138,172,.35),-3px -3px 8px rgba(255,255,255,.9)}
main{max-width:1180px;margin:0 auto;padding:24px 28px 80px}
h2{font-size:17px;margin:24px 0 12px;display:flex;align-items:center;gap:8px;font-weight:700}
h2:first-child{margin-top:0}
h2 .ic{width:19px;height:19px;color:var(--accent);flex:none}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.75);border-radius:var(--r);box-shadow:var(--neu);padding:18px 20px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.g4,.g2,.g3{grid-template-columns:1fr}}
.stat{display:flex;align-items:center;gap:14px}
.stat .big{font-size:26px;font-weight:700;letter-spacing:-.5px}
.stat .sub{font-size:12px;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:999px;background:linear-gradient(145deg,#f28ab4,#e0699c);color:#fff;font-weight:500;transition:background .18s,transform .12s,box-shadow .18s;box-shadow:4px 4px 10px rgba(214,138,172,.32),-3px -3px 8px rgba(255,255,255,.9)}
.btn:hover{background:linear-gradient(145deg,#ee7aa9,#d95d92)}
.btn:active{transform:scale(.96);box-shadow:var(--neu-in)}
.btn.ghost{background:#fff3f8;color:var(--accent-deep);box-shadow:var(--neu-sm)}
.btn.ghost:hover{background:#ffe9f3}
.btn.sm{padding:4px 12px;font-size:12px}
.btn.danger{background:#ffeef2;color:var(--danger);box-shadow:var(--neu-sm)}
.btn.danger:hover{background:#fbdae2}
.pbar{height:8px;background:#f9e6ee;border-radius:6px;overflow:hidden;flex:1}
.pbar>i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .4s}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:500}
.tag.gray{background:#f6eff3;color:#b08fa0}
.tag.blue{background:#f1ecf9;color:#8d6fae}
.tag.green{background:#fdebf3;color:#c25d8a}
.tag.orange{background:#fdf0e4;color:#bd7f51}
.tag.red{background:#fde5e9;color:#c9566f}
.tag.pink{background:#fdebf3;color:#c25d8a}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--ink2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap}
td{padding:10px;border-bottom:1px solid #fbeef4;vertical-align:middle}
tr:hover td{background:#fef7fa}
.course-card{border-top:4px solid var(--accent)}
.task-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #fbeef4}
.task-row:last-child{border-bottom:none}
.chk{width:18px;height:18px;border:2px solid #eec3d6;border-radius:50%;flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;transition:background .18s,border-color .18s}
.chk:hover{border-color:var(--accent)}
.chk.on{background:var(--accent);border-color:var(--accent)}
.bar-mini{height:6px;background:#f9e6ee;border-radius:4px;overflow:hidden;flex:1;min-width:60px}
.bar-mini>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.muted{color:var(--ink2);font-size:12px}
.sync-ok{color:var(--accent-deep)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);background:linear-gradient(145deg,#e879a6,#d15c8f);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;box-shadow:0 12px 28px rgba(200,100,150,.35);opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;z-index:300;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#pwa-hint{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:8px;margin:0 auto 10px;max-width:1100px;padding:10px 14px;background:linear-gradient(145deg,#fdeef4,#f9dbe8);border:1px solid #f2cddd;border-radius:0 0 14px 14px;font-size:13px;line-height:1.5;color:#a24d73}
#pwa-hint .ic{width:16px;height:16px;flex:none;color:var(--accent-deep)}
#pwa-hint b{color:var(--accent-deep);font-weight:500}
#pwa-hint .x{margin-left:auto;background:none;border:0;color:#c98aa8;font-size:19px;line-height:1;cursor:pointer;padding:0 2px}
.modal-mask{position:fixed;inset:0;background:rgba(87,67,80,.4);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:linear-gradient(145deg,#fff8fb,#ffe9f3);border:1px solid rgba(255,255,255,.75);border-radius:22px;padding:24px;width:560px;max-width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(160,80,120,.3),-6px -6px 16px rgba(255,255,255,.6)}
.modal h3{margin-bottom:6px;font-size:16px;display:flex;align-items:center;gap:7px}
.modal h3 .ic{width:18px;height:18px;color:var(--accent)}
.modal .row{display:flex;gap:12px}
.modal .row>div{flex:1}
.subtask{display:flex;align-items:center;gap:8px;padding:6px 0}
.milestone{border-left:3px solid var(--accent);padding:10px 14px;background:linear-gradient(90deg,#fff2f8,#ffe9f3);border-radius:0 12px 12px 0;margin-bottom:10px;box-shadow:var(--neu-sm)}
/* 总览统计图标块（参考渐变卡片排版） */
.tile{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#f28ab4,#e0699c);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:4px 4px 10px rgba(214,138,172,.32),-3px -3px 8px rgba(255,255,255,.9)}
.tile .ic{width:22px;height:22px}
.tile.soft{background:linear-gradient(145deg,#fff,#ffe4f0);color:var(--accent-deep);box-shadow:var(--neu-sm)}
.tile.lilac{background:linear-gradient(145deg,#b49ae0,#9d7fd0);box-shadow:4px 4px 10px rgba(157,127,208,.3),-3px -3px 8px rgba(255,255,255,.9)}
.prio-num{width:26px;height:26px;border-radius:9px 9px 9px 2px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.prio-num.late{background:var(--danger)}
.prio-num.near{background:var(--warn)}
/* ===== 粘贴图片识别 ===== */
.drop-paste{border:2px dashed #f0c4d8;background:linear-gradient(145deg,#fffafc,#ffeef6);border-radius:14px;padding:14px 16px;text-align:center;cursor:text;transition:border-color .18s,background .18s}
.drop-paste:hover{border-color:var(--accent2)}
.drop-paste.over{border-color:var(--accent);background:#ffe7f2;box-shadow:0 0 0 4px rgba(232,121,166,.14)};
.drop-paste .ic{width:19px;height:19px;color:var(--accent)}
.drop-paste b{color:var(--accent-deep)}
.pv-wrap{margin-top:10px}
.pv-box{position:relative;display:inline-block;line-height:0}
.pv-box img{max-width:100%;max-height:190px;border-radius:12px;border:1px solid #f2cddd;display:block}
.pv-box .pv-x{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(209,92,143,.86);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;cursor:pointer}
.pv-box .pv-x:hover{background:#c9566f}
.pv-chip{display:inline-flex;align-items:center;gap:6px;background:#fdebf3;color:#c25d8a;border:1px solid #f5cfe0;border-radius:999px;padding:4px 12px;font-size:12px;margin-top:8px}
.pv-chip .ic{width:14px;height:14px}
.ai-lit-item{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border-radius:14px;background:var(--panel);border:1px solid rgba(255,255,255,.7);box-shadow:var(--neu-sm);margin-bottom:8px}
.ai-lit-item .n{flex:none;min-width:20px;height:20px;border-radius:7px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;margin-top:1px}
.seg{display:inline-flex;background:#fdeef5;border-radius:999px;padding:3px;gap:2px;box-shadow:var(--neu-in)}
.seg button{padding:5px 16px;border-radius:999px;color:var(--ink2);transition:.18s}
.seg button.on{background:linear-gradient(145deg,#fff,#ffeef6);color:var(--accent-deep);font-weight:600;box-shadow:3px 3px 7px rgba(214,138,172,.22),-2px -2px 6px rgba(255,255,255,.95)}
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid rgba(255,255,255,.7);box-shadow:var(--neu-sm);margin-bottom:8px;transition:.18s}
.todo-item:hover{box-shadow:var(--neu)}
.todo-item.done{opacity:.5}
.todo-item .t{flex:1}
.todo-item.done .t{text-decoration:line-through}
/* ===== 待办：任务分组 + 子任务清单 ===== */
.task-group{border-radius:16px;background:var(--panel);border:1px solid rgba(255,255,255,.7);box-shadow:var(--neu-sm);margin-bottom:12px;padding:11px 13px 9px;transition:.18s}
.task-group:hover{box-shadow:var(--neu)}
.tg-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.tg-head b{color:var(--ink)}
.tg-dot{width:9px;height:9px;border-radius:50%;flex:none}
.tg-subs{margin:3px 0 0 8px;padding-left:11px;border-left:2px solid #f6dbe7}
.todo-item.sub{margin:6px 0 0;padding:7px 10px;background:linear-gradient(145deg,#fffafd,#fff2f8);box-shadow:none;border:1px solid rgba(255,255,255,.85)}
.todo-item.sub:hover{box-shadow:var(--neu-sm)}
.todo-item.sub .t{font-size:13.5px;color:var(--ink2)}
/* ===== AI 结果可编辑表单 ===== */
.ai-edit{border-radius:16px;background:var(--panel);border:1px solid rgba(255,255,255,.7);box-shadow:var(--neu-sm);margin-bottom:12px;padding:12px 13px}
.ai-edit.off{opacity:.45}
.ai-edit-head{display:flex;align-items:center;gap:8px}
.ai-edit-head input[type=text]{flex:1;font-weight:600}
.ai-edit-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:9px}
.ai-edit-fields label{font-size:11px;color:var(--ink2);margin:0 0 3px;display:block}
.ai-edit-fields input,.ai-edit-fields select{font-size:13px;padding:6px 9px}
.ai-subs{margin-top:10px;border-top:1px dashed #f3d8e6;padding-top:9px}
.ai-subs-head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);margin-bottom:6px}
.ai-sub-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.ai-sub-row input[type=text]{flex:1;font-size:13px;padding:6px 9px}
.ai-sub-row .mini{width:26px;height:26px;padding:0;flex:none;font-size:12px;line-height:1}
.ai-x{width:28px;height:28px;padding:0;flex:none;font-size:14px;line-height:1;border-radius:9px}
.ai-tag-new{font-size:11px;padding:1px 7px;border-radius:8px;background:#fdeef5;color:#c25d8a;white-space:nowrap;flex:none}
.todo-item.sub .chk{width:16px;height:16px}
.tg-more{margin:6px 0 2px 2px;font-size:12px}
.tip{background:#fdf0f6;border:1px solid #f2cddd;color:#b05780;border-radius:14px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.empty{text-align:center;color:var(--ink2);padding:36px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:8px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
details summary{cursor:pointer;font-size:13px;color:var(--ink2)}
/* ===== 内联 SVG 图标 ===== */
i.ic{display:inline-flex;width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
i.ic svg{width:100%;height:100%;display:block}
/* ===== 工作板块：四步进度条 ===== */
.stepper{display:flex;align-items:flex-start;margin:14px 0 4px}
.stage{flex:0 0 auto;width:76px;text-align:center}
.stage-dot{width:40px;height:40px;border-radius:14px 14px 14px 4px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#fff,#ffe9f3);border:1px solid rgba(255,255,255,.8);box-shadow:var(--neu-sm);cursor:pointer;transition:.18s;user-select:none;color:#c98aab}
.stage-dot .ic{width:19px;height:19px}
.stage-dot:hover{transform:translateY(-2px)}
.stage.active .stage-dot{background:#fff0f6;border-color:var(--accent);color:var(--accent-deep);box-shadow:0 0 0 4px rgba(232,121,166,.16)}
.stage.done .stage-dot{background:var(--ok);border-color:var(--ok);color:#fff}
.stage-label{font-size:12px}
.stage-meta{font-size:11px;color:var(--ink2)}
.stage-meta.late{color:var(--danger);font-weight:600}
.stage-line{flex:1;height:3px;border-radius:2px;background:#f6dce7;margin-top:19px;min-width:10px}
.stage.done + .stage-line{background:var(--ok)}
.stage.active + .stage-line{background:linear-gradient(90deg,var(--accent),#f6dce7)}
/* ===== 存钱罐 ===== */
.pig-wrap{display:flex;justify-content:center;align-items:center;position:relative}
@keyframes dropcoin{0%{transform:translateY(-46px);opacity:0}60%{opacity:1}100%{transform:translateY(0);opacity:1}}
.coin-fall{animation:dropcoin .7s cubic-bezier(.4,1.5,.6,1) both}
@keyframes popbadge{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;
  background:#fff6e0;color:#a97a13;border:1px solid #f5dfa8;animation:popbadge .4s ease both}
.badge.locked{background:#f8eff3;color:#c4a7b3;border-color:#f0dbe4;animation:none}
.badge .ic{width:13px;height:13px}
.money-big{font-size:34px;font-weight:800;letter-spacing:-1px;color:#c25d8a}
.coin-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #fbeef4}
.goal-bar{height:14px;border-radius:8px;background:#f9e6ee;overflow:hidden;position:relative}
.goal-bar>i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#ffd479,#f0a13a);transition:width .8s}
/* 细节 */
::selection{background:#f8d9e7}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#f0cddd;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#e7b3c9}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="ic" data-ic="bow"></span>小岛的工作台<small>PASTEL SEMESTER</small></div>
  <div class="seminfo" id="hdr-sem"></div>
  <nav id="tabs"></nav>
</header>
<main id="view"></main>
<div id="modal-root"></div>

<script src="gsap.min.js"></script>
<script src="ScrollTrigger.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script>
/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const d2s=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const s2d=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayStr=()=>d2s(new Date());
const fmtMD=s=>s.slice(5).replace('-','/');
const WEEKCN=['日','一','二','三','四','五','六'];
const wk=s=>WEEKCN[s2d(s).getDay()];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function daysBetween(a,b){return Math.round((s2d(b)-s2d(a))/864e5)}
function teachWeek(ds){const diff=daysBetween(S.semester.start,ds);return diff<0?null:Math.floor(diff/7)+1}
function semWeeks(){return Math.floor(daysBetween(S.semester.start,S.semester.end)/7)+1}
function monthName(ds){return s2d(ds).getMonth()+1+'月'}

/* ================= 可爱图标库（手绘线稿 SVG，替代 emoji） ================= */
const __SVG=inner=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const ICONS={

const KEY='semester-workbench-v1';

  _rev:0,updatedAt:0

let S=defaultState(),MODE='local'; // local=仅本机浏览器 / server=已连上数据服务（电脑与手机共用同一份）/ cloud=已连上 GitHub Gist（任何设备共用同一份）

let DIRTY=false;      // 本机是否有还没同步成功的改动
let saveTimer=null,pollTimer=null,conflictShown=false,syncNote='';
let GIST_ETAG='',GIST_LAST=null,lastCloudPush=0,cloudTimer=null; // Gist 条件请求缓存（ETag+最近一次内容）/ 推送节流
const GIST_FILE='data.json';

function localCopy(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.tasks))return d}catch(e){}return null}
function hasData(d){return !!(d&&((d.tasks&&d.tasks.length)||(d.courses&&d.courses.length)||(d.projects&&d.projects.length)))}

/* 兜底备份：任何要把本机数据换成服务端数据的时刻，先把本机那份悄悄存起来，

const KEY_BAK=KEY+'.bak';
function stashLocal(reason){

    const cur=localStorage.getItem(KEY);
    if(!cur)return;
    localStorage.setItem(KEY_BAK,JSON.stringify({at:Date.now(),reason:reason||'',data:cur}));

}
function bakInfo(){

}
function restoreLocal(){

/* 保存：先落浏览器（防丢），再推给数据服务 / 云端 Gist（多设备同步） */
function save(){persist();syncPush()}
function syncPush(force){
  if(MODE!=='server'&&MODE!=='cloud')return;
  DIRTY=true;clearTimeout(saveTimer);
  // 云端防抖更长：Gist 每次保存都会留一个历史版本，别把版本历史刷屏
  saveTimer=setTimeout(()=>pushNow(force),MODE==='cloud'?1500:400);
}
async function pushNow(force){
  if(MODE==='server'){
    try{
      const body=JSON.stringify(Object.assign({},S,{_rev:REV,_client:CLIENT}));
      const r=await fetch('/api/state'+(force?'?force=1':''),{method:'POST',headers:{'Content-Type':'application/json'},body});
      if(r.status===409){DIRTY=false;return handleConflict(await r.json())}
      if(r.ok){
        const d=await r.json();
        if(typeof d.rev==='number')REV=d.rev;
        S._rev=REV;DIRTY=false;conflictShown=false;
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        setSyncLabel('已同步');syncNote='已同步';
      }
    }catch(e){setSyncLabel('未连上电脑服务');}
    return;
  }
  if(MODE==='cloud'){
    try{
      if(!force&&Date.now()-lastCloudPush<60000){
        // 节流：一分钟内的多次改动攒成一版再推，避免历史版本刷屏（「立即同步」不受限）
        clearTimeout(cloudTimer);
        cloudTimer=setTimeout(()=>pushNow(true),60000-(Date.now()-lastCloudPush));
        return;
      }
      if(!force){
        // Gist 没有条件更新：推送前先取云端最新，版本对不上就走冲突对话框，绝不静默覆盖
        const r=await gistGet();
        if(r.error){setSyncLabel('云同步失败');syncNote='云同步失败';toast('云同步失败：'+r.error);return}
        if(r.data&&typeof r.data._rev==='number'&&r.data._rev!==(REV||0)){
          DIRTY=false;
          return handleConflict({data:r.data,rev:r.data._rev||0});
        }
      }
      lastCloudPush=Date.now();
      // 冲突覆盖（force）时取「双方已知最大版本号 +1」，绝不能跟云端现有 rev 撞号，
      // 否则另一台设备会因「版本号没变」永远看不到新内容
      let base=REV||0;
      if(force){
        try{const r0=await gistGet();if(r0.data&&typeof r0.data._rev==='number')base=Math.max(base,r0.data._rev)}catch(e2){}
      }
      const next=Object.assign({},S,{_rev:base+1,_client:CLIENT});
      const pr=await gistPatch(next);
      if(pr.ok){
        REV=next._rev;S._rev=REV;DIRTY=false;conflictShown=false;GIST_ETAG='';GIST_LAST=null;
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        setSyncLabel('已同步');syncNote='已同步';
      }else{setSyncLabel('云同步失败');syncNote='云同步失败';toast('云同步失败：'+(pr.error||'未知错误'))}
    }catch(e){setSyncLabel('未连上云端');}
  }
}
/* ============ GitHub 云同步（秘密 Gist）：跨互联网多设备 + 历史版本 ============
   数据存在你 GitHub 账号的秘密 Gist（public:false，不公开列出，仅令牌可读写）。
   每次 PATCH 保存，Gist 自动留一个 revision，GitHub 网页可随时查看/回滚 —— 这就是历史版本。
   Gist API 不支持条件更新，所以推送前先 GET 对比 _rev，对不上就走 handleConflict，绝不静默覆盖。 */
function ghCfg(){
  const g=S.settings.github||{};
  return {token:g.token||'',gistId:(g.gistId||'').trim(),api:((g.api||'https://api.github.com').trim()||'https://api.github.com').replace(/\/+$/,'')};
}
function ghHeaders(extra){
  const c=ghCfg();
  return Object.assign({'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'},extra||{});
}
/* GET Gist：带 ETag 条件请求，内容没变时 GitHub 返回 304，不消耗 API 限额 —— 轮询成本极低 */
async function gistGet(){
  const c=ghCfg();
  if(!c.token||!c.gistId)return {error:'未配置完整（需要 Token 和 Gist ID）'};
  try{
    const h={};
    if(GIST_ETAG)h['If-None-Match']=GIST_ETAG;
    const r=await fetch(c.api+'/gists/'+encodeURIComponent(c.gistId),{headers:ghHeaders(h),cache:'no-store'});
    if(r.status===304)return {unchanged:true,data:GIST_LAST}; // 内容没变 = 与上次拿到的相同，直接复用缓存
    if(r.status===401)return {error:'令牌无效或过期（401），请到 GitHub 重新生成'};
    if(r.status===404)return {error:'找不到这个 Gist（404），请检查 Gist ID 或令牌权限'};
    if(!r.ok)return {error:'GitHub 返回 HTTP '+r.status+(r.status===403?'（可能触发限速，请稍等再试）':'')};
    GIST_ETAG=r.headers.get('ETag')||'';
    const j=await r.json();
    const f=j.files&&j.files[GIST_FILE];
    if(!f){GIST_LAST=null;return {data:null}} // Gist 存在但还没写过数据文件 → 视作空云端（首次会自动播种）
    if(f.truncated)return {error:'Gist 里的数据文件过大被截断，为防丢失已暂停同步'};
    let d=null;
    try{d=f.content?JSON.parse(f.content):null}catch(e){return {error:'Gist 里的 data.json 不是有效 JSON'}}
    GIST_LAST=d;
    return {data:d};
  }catch(e){return {error:'连不上 GitHub（'+((e&&e.message)||e)+'）。网络不稳定可在设置里填代理 API 地址'}}
}
async function gistPatch(obj){
  const c=ghCfg();
  try{
    const r=await fetch(c.api+'/gists/'+encodeURIComponent(c.gistId),{method:'PATCH',headers:ghHeaders({'Content-Type':'application/json'}),
      body:JSON.stringify({files:{"data.json":{content:JSON.stringify(obj)}}})});
    if(r.status===401)return {error:'令牌无效或没有 gist 权限（401）'};
    if(!r.ok)return {error:'GitHub 返回 HTTP '+r.status};
    return {ok:true};
  }catch(e){return {error:'连不上 GitHub'}}
}
async function gistCreate(obj){
  const c=ghCfg();
  try{
    const r=await fetch(c.api+'/gists',{method:'POST',headers:ghHeaders({'Content-Type':'application/json'}),
      body:JSON.stringify({description:'小岛的工作台 · 数据自动同步（每次保存自动留历史版本）',public:false,files:{"data.json":{content:JSON.stringify(obj)}}})});
    if(!r.ok)return {error:'创建 Gist 失败：HTTP '+r.status};
    const j=await r.json();
    if(!j||!j.id)return {error:'创建 Gist 失败：响应里没有 id'};
    return {id:j.id};
  }catch(e){return {error:'连不上 GitHub，创建失败（数据仍安全存在本机）'}}
}
/* cloud 模式初始化：取云端数据并融合（逻辑与 server 模式一致：按 updatedAt 取较新、空云端播种本机） */
async function initCloud(){
  try{
    const r=await gistGet();
    if(r.error)return {ok:false,error:r.error};
    const local=localCopy();
    MODE='cloud';
    const cd=r.data||null;
    REV=(cd&&cd._rev)||0;
    const cHas=hasData(cd),lcHas=hasData(local);
    let need=false;
    if(cHas&&lcHas){
      if((local.updatedAt||0)>(cd.updatedAt||0)){
        S=Object.assign(defaultState(),local);S._rev=REV;persist();need=true;
        syncNote='已把本机数据合并到云端';
      }else{stashLocal('初始化时以云端为准');S=Object.assign(defaultState(),cd||{});syncNote='已连上云端'}
    }else if(cHas){S=Object.assign(defaultState(),cd||{});syncNote='已连上云端'}
    else if(lcHas){S=Object.assign(defaultState(),local);S._rev=REV;persist();need=true;syncNote='已把本机数据写入云端'}
    else{S=Object.assign(defaultState(),cd||{});S._rev=REV;syncNote='云端还没有数据'}

    }catch(e){}

/* ================= 进度计算 ================= */
function taskProgress(t){
  if(t.done)return 100;
  if(t.subtasks&&t.subtasks.length)return Math.round(100*t.subtasks.filter(s=>s.done).length/t.subtasks.length);
  return t.manualProgress||0;
}
function courseProgress(cid){
  const ts=S.tasks.filter(t=>t.courseId===cid);
  if(!ts.length)return 0;
  let w=0,p=0;ts.forEach(t=>{const h=t.estHours||4;w+=h;p+=h*taskProgress(t)/100});
  return w?Math.round(p/w*100):0;
}
function semesterProgress(){
  const total=daysBetween(S.semester.start,S.semester.end);
  return Math.min(100,Math.max(0,Math.round(100*daysBetween(S.semester.start,todayStr())/total)));
}
function orderedTasks(){
  const map={};S.tasks.forEach(t=>map[t.id]=t);
  const eff=t=>{let d=t.dueDate;(t.dependencies||[]).forEach(id=>{const p=map[id];if(p&&p.dueDate>d)d=p.dueDate});return d};
  return[...S.tasks].sort((a,b)=>eff(a)<eff(b)?-1:eff(a)>eff(b)?1:0);
}
/* 统一规划条目：学习任务 + 小红书工作的四个阶段 */
/* ================= 每周重复任务 =================
   例：「中国新闻传播史 每周二小测」——任务带 repeat:{freq:'weekly',weekday:2}（0=周日）。
   repeatDates 在学期内（学期开始 → min(截止日期, 学期结束)）展开每一次发生日；
   allPlanItems 据此生成两类条目（不写回任务本身）：
   - 发生日当天：ref rpt:<id>:<ds>，当天去做这件事
   - 前一天：ref rpt:<id>:<ds>:prep，名字「准备：xxx」，提前一天提醒复习
   带重复的任务不再生成基础 task: 条目（否则预计工时会被摊满整个学期）。 */
const WEEKDAY_NAMES=['周日','周一','周二','周三','周四','周五','周六'];
function isRepeatTask(t){return !!(t.repeat&&t.repeat.freq==='weekly'&&t.repeat.weekday>=0&&t.repeat.weekday<=6)}
function repeatDates(t){
  const out=[];
  if(!isRepeatTask(t))return out;
  const end=t.dueDate&&t.dueDate<S.semester.end?t.dueDate:S.semester.end;
  let d=s2d(S.semester.start);
  while(d.getDay()!==t.repeat.weekday)d=addDays(d,1);
  for(let guard=0;guard<400;guard++){
    const ds=d2s(d);
    if(ds>end)break;
    out.push(ds);
    d=addDays(d,7);
  }
  return out;
}
function allPlanItems(){
  const items=[];
  S.tasks.forEach(t=>{
    if(!t.dueDate)return;
    if(isRepeatTask(t))return;   // 重复任务走下面的展开逻辑
    items.push({ref:'task:'+t.id,kind:'study',id:t.id,stage:'',name:t.name,sub:courseName(t.courseId),color:courseColor(t.courseId),
      dueDate:t.dueDate,estHours:t.estHours||4,done:!!t.done,progress:taskProgress(t),startDate:t.startDate||'',
      subs:t.subtasks||[]});
  });
  S.tasks.forEach(t=>{
    if(t.done||!isRepeatTask(t))return;
    const wds=WEEKDAY_NAMES[t.repeat.weekday];
    const dates=repeatDates(t);
    // t.estHours 是整学期做这件事的总工时：均摊到每次发生（如 20h/16 周 ≈ 每次 1.25h），而不是整个算给某一天
    const per=Math.max(0.5,Math.round(((t.estHours||0.5)/Math.max(1,dates.length))*2)/2);
    dates.forEach(ds=>{
      items.push({ref:'rpt:'+t.id+':'+ds,kind:'study',id:t.id,stage:'',rpt:true,name:t.name,sub:courseName(t.courseId),color:courseColor(t.courseId),
        dueDate:ds,estHours:per,done:false,progress:0,startDate:ds,subs:[]});
      const pd=d2s(addDays(s2d(ds),-1));   // 前一天：准备提醒
      if(pd>=S.semester.start)items.push({ref:'rpt:'+t.id+':'+ds+':prep',kind:'study',id:t.id,stage:'',rpt:true,prep:true,
        name:'准备：'+t.name,sub:courseName(t.courseId),color:courseColor(t.courseId),
        dueDate:pd,estHours:per,done:false,progress:0,startDate:pd,subs:[]});
    });
  });
  (S.projects||[]).forEach(p=>{
    WORK_STAGES.forEach((s,i)=>{
      const st=(p.stages&&p.stages[s.key])||{};
      const prev=i>0?((p.stages&&p.stages[WORK_STAGES[i-1].key])||{}):null;
      items.push({ref:'stage:'+p.id+':'+s.key,kind:'work',id:p.id,stage:s.key,pid:p.id,
        name:p.name+' · '+s.label,sub:(p.brand?p.brand+' · ':'')+'小红书工作',color:WORK_COLOR,
        dueDate:st.due||p.deliverDate,estHours:st.est||4,done:st.status===2,
        progress:st.status===2?100:(st.status===1?(st.progress||50):0),
        startDate:prev&&prev.due?prev.due:'',projectName:p.name});
    });
  });
  return items;
}
function itemByRef(ref){return allPlanItems().find(x=>x.ref===ref)}
/* 把某个条目的「未完成子任务」按天数摊到每一天：返回 { ds: [子任务...] }
   摊法：剩余子任务条数 ÷ 剩余可用天数，向上取整错开分配（保证总量守恒、越往后越少） */
function splitSubs(it,start,endDs){
  const pend=(it.subs||[]).filter(s=>!s.done);
  const out={};
  if(!pend.length)return out;
  const n=Math.max(1,daysBetween(start,endDs)+1);
  // 用「累计应完成比例」决定第 i 天结束时该做完几条，差值就是当天分配的条数
  let prevCut=0;
  for(let i=0;i<n;i++){
    const ds=d2s(addDays(s2d(start),i));
    const cut=Math.round(pend.length*(i+1)/n);
    out[ds]=pend.slice(prevCut,cut);
    prevCut=cut;
  }
  return out;
}
/* 变体：按「每天分到的工时」权重摊子任务条数（hoursByDs: {日期: 小时}），总量守恒 */
function splitSubsW(it,hoursByDs){
  const pend=(it.subs||[]).filter(s=>!s.done);
  const out={};
  if(!pend.length)return out;
  const dss=Object.keys(hoursByDs).filter(ds=>hoursByDs[ds]>0).sort();
  const tot=dss.reduce((s,ds)=>s+hoursByDs[ds],0);
  if(!dss.length||tot<=0)return out;
  let prevCut=0,acc=0;
  dss.forEach((ds,i)=>{
    acc+=hoursByDs[ds];
    const cut=(i===dss.length-1)?pend.length:Math.min(pend.length,Math.ceil(pend.length*acc/tot)); // ceil：当天有工时且还有剩子任务时至少给 1 条
    out[ds]=pend.slice(prevCut,cut);
    prevCut=cut;
  });
  return out;
}
/* 每日建议学习量：把每个任务的剩余工时装进「每日学习时长」额度里。
   排法：截止越近越先挑日子；每个任务从开始日往后扫，哪天额度还有空位就装一点；
   当天装满了就跳过（等价于把任务往后挪），截止远的任务自然落进前面几周的富余日子。

function dayPlan(){
  const map={};const td=todayStr();
  const B=S.settings.studyBudget||{};
  const budgetOf=ds=>{const v=B[s2d(ds).getDay()];return(typeof v==='number'&&v>=0)?v:3}; // 没配置时按每天 3h 兜底
  const used={};

    .sort((a,b)=>a.dueDate===b.dueDate?(b.estHours-a.estHours):(a.dueDate<b.dueDate?-1:1));
  const perTask={};   // ref -> { 日期: 当天分到的工时 }
  items.forEach(it=>{
    const remain=it.estHours*(1-(it.progress||0)/100);
    let start=(it.startDate&&it.startDate>td)?it.startDate:td;
    if(daysBetween(start,it.dueDate)<0)start=it.dueDate; // 已过期：压到截止日
    const dsList=[];
    for(let ds=start;ds<=it.dueDate;ds=d2s(addDays(s2d(ds),1)))dsList.push(ds);
    if(!dsList.length)return;
    const hrs={};
    let rem=Math.round(remain*100)/100;
    for(const ds of dsList){                     // 第一轮：受每日额度约束，从前往后装
      if(rem<=0.001)break;
      const cap=(budgetOf(ds)||0)-(used[ds]||0);
      if(cap<=0.001)continue;
      const q=Math.max(0.25,Math.round(Math.min(rem,cap,4)*4)/4); // 单任务单日最多 4h，步进 0.25h
      const real=Math.min(rem,q);
      hrs[ds]=(hrs[ds]||0)+real; used[ds]=(used[ds]||0)+real;
      rem=Math.round((rem-real)*100)/100;
    }
    if(rem>0.001){                               // 第二轮：窗口不够装 → 溢出平摊，保截止
      const extra=rem/dsList.length;
      dsList.forEach((ds,i)=>{
        const add=(i===dsList.length-1)?(rem-extra*(dsList.length-1)):extra;
        hrs[ds]=(hrs[ds]||0)+add; used[ds]=(used[ds]||0)+add;
      });
    }
    perTask[it.ref]=hrs;
  });
  items.forEach(it=>{
    const hrs=perTask[it.ref]||{};
    const subMap=splitSubsW(it,hrs);   // 子任务按每天工时比例摊；没子任务时待办仍按任务标题显示
    Object.keys(hrs).forEach(ds=>{
      const subs=(subMap[ds]||[]).map(s=>({id:s.id,name:s.name}));
      (map[ds]=map[ds]||[]).push({ref:it.ref,kind:it.kind,hours:hrs[ds],name:it.name,color:it.color,sub:it.sub,stage:it.stage,projectName:it.projectName||'',
        subs,subTotal:(it.subs||[]).length});
    });
  });
  return map;
}
function latestStart(t){
  const per=S.settings.workPerDay||3;
  const days=Math.ceil((t.estHours||4)/per);
  return d2s(addDays(s2d(t.dueDate),-days+1));
}

function toggleRef(ref){
  if(ref.indexOf('task:')===0){const t=S.tasks.find(x=>x.id===ref.slice(5));if(t){t.done=!t.done;save();render()}}
  else if(ref.indexOf('stage:')===0){const[,pid,st]=ref.split(':');cycleStage(pid,st)}
  else if(ref.indexOf('rpt:')===0){
    // 重复任务的单次发生/准备条目：勾选 = 固化并勾掉当天的待办（不影响其他周）
    const ds=ref.split(':')[2];const l=S.todos[ds]||(S.todos[ds]=[]);
    const x=l.find(t=>t.source==='auto'&&t.ref===ref);
    if(x)x.done=!x.done;
    else{const it=itemByRef(ref);if(it)l.push({id:uid(),text:`${it.name}（${it.estHours}h）`,done:true,ref,kind:'study',source:'auto'})}
    save();render();
  }
}

/* ================= 待办页 ================= */
let todoMode='day',todoDate=todayStr(),todoWkStart=null,todoMon=null;
function weekStartOf(ds){const d=s2d(ds);const off=(d.getDay()===0?-6:d.getDay()-1);return d2s(addDays(d,-off))}
/* anim=false 时跳过入场动画：勾选/删除待办只做原地更新，
   否则整块重播动画会被打断，停在半透明的「灰掉」状态 */
function renderTodo(anim){
  todoDate=todoDate||todayStr();
  const dp=dayPlan();
  const view=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">
    <div style="display:flex;gap:12px;align-items:center">
      <div class="seg">
        <button class="${todoMode==='day'?'on':''}" onclick="todoMode='day';renderTodo()">每日</button>
        <button class="${todoMode==='week'?'on':''}" onclick="todoMode='week';renderTodo()">每周</button>
        <button class="${todoMode==='month'?'on':''}" onclick="todoMode='month';renderTodo()">每月</button>
      </div>
      <div class="seg">
        <button class="${todoFilter==='all'?'on':''}" onclick="todoFilter='all';renderTodo()">全部</button>
        <button class="${todoFilter==='study'?'on':''}" onclick="todoFilter='study';renderTodo()"><i class="ic" data-ic="cat"></i> 学习</button>
        <button class="${todoFilter==='work'?'on':''}" onclick="todoFilter='work';renderTodo()"><i class="ic" data-ic="camera"></i> 工作</button>
      </div>
      <input type="date" style="width:auto" value="${todoMode==='day'?todoDate:todoMode==='week'?(todoWkStart=todoWkStart||weekStartOf(todoDate),todoWkStart):(todoMon=todoMon||todoDate.slice(0,7)+'-01',todoMon)}" onchange="todoDateChange(this.value)">
    </div>
    <button class="btn sm" onclick="addTodoModal()">＋ 自定义待办</button>
  </div>
  <div id="todo-body"></div>`;
  $('#view').innerHTML=view;
  if(todoMode==='day')renderDay();
  else if(todoMode==='week')renderWeek();
  else renderMonth();
  if(anim!==false&&!FX.busy)FX.enterInto('#todo-body');
}
function todoDateChange(v){
  if(todoMode==='day')todoDate=v||todayStr();
  else if(todoMode==='week')todoWkStart=weekStartOf(v||todayStr());
  else todoMon=(v||todayStr()).slice(0,7)+'-01';
  renderTodo(false);
}
function todoList(ds){return S.todos[ds]||[]}
let DP={};
let todoFilter='all'; // all | study | work
function computeDP(){DP=dayPlan()}
function dpSug(ds){return DP[ds]||[]}
function passFilter(kind){return todoFilter==='all'||todoFilter===(kind||'study')}
function stageLabel(key){const s=WORK_STAGES.find(x=>x.key===key);return s?s.label:key}
/* 找到某条待办对应的父任务（学习任务才有），用于子任务勾选联动 */
function taskOfRef(ref){
  if(!ref||ref.indexOf('task:')!==0)return null;
  return S.tasks.find(t=>t.id===ref.slice(5))||null;
}
/* 勾选待办。条目可能是「任务标题」也可能是一条「子任务」（带 subId）。
   勾子任务 ⇒ 写回父任务的 subtasks[i].done，任务进度随之自动推进。 */
function toggleTodo(ds,id){
  const x=todoList(ds).find(t=>t.id===id);
  if(!x)return;
  x.done=!x.done;
  if(x.subId){
    const t=taskOfRef(x.ref);
    const st=t&&(t.subtasks||[]).find(s=>s.id===x.subId);
    if(st)st.done=x.done;
    // 子任务全做完 ⇒ 父任务自动收尾；反之撤销完成态
    if(t&&t.subtasks&&t.subtasks.length){
      if(t.subtasks.every(s=>s.done))t.done=true;
      else if(t.done)t.done=false;
    }
  }else if(x.done&&x.ref&&x.ref.indexOf('task:')===0){
    // 勾选整条任务 ⇒ 它的子任务一并标记完成
    const t=taskOfRef(x.ref);
    if(t&&t.subtasks)t.subtasks.forEach(s=>s.done=true);
  }
  save();renderTodo(false);
}
/* 删除：任务级删除记进 dismissed[ds] 防止自动加回；子任务级删除记进 dismissedSub[ds] */
function delTodo(ds,id){
  const x=todoList(ds).find(t=>t.id===id);
  if(x&&x.source==='auto'&&x.ref){
    if(!S.dismissed)S.dismissed={};
    const d=S.dismissed[ds]||(S.dismissed[ds]=[]);
    if(x.subId){
      // 只移掉这一条子任务，任务其他子任务照常出现
      const key=x.ref+'#'+x.subId;
      if(d.indexOf(key)<0)d.push(key);
      toast('已从今天移除这一条（其他子任务不受影响）');
    }else{
      if(d.indexOf(x.ref)<0)d.push(x.ref);
      toast('已从今天移除（任务本身还在，其他天不受影响）');
    }
  }
  S.todos[ds]=todoList(ds).filter(t=>t.id!==id);
  if(!S.todos[ds].length)delete S.todos[ds];
  save();renderTodo(false);
}
/* 把当天建议固化成待办条目。同一任务会拆成多条：
   有子任务 ⇒ 每条子任务一个条目（带 subId）；没子任务 ⇒ 沿用任务标题。 */
function matSug(ds){
  const sug=dpSug(ds).filter(s=>passFilter(s.kind));
  if(!sug.length)return;
  const l=S.todos[ds]||(S.todos[ds]=[]);
  const dis=S.dismissed&&S.dismissed[ds]?S.dismissed[ds]:[]; // 当天被用户删掉的，不再自动加回
  let changed=false;
  sug.forEach(s=>{
    const subs=s.subs||[];
    if(subs.length){
      subs.forEach(sub=>{
        const key=s.ref+'#'+sub.id;
        if(dis.indexOf(key)>=0)return;
        if(!l.find(x=>x.source==='auto'&&x.subId===sub.id)){   // 用 subId 去重，支持同一任务多条
          l.push({id:uid(),text:sub.name,done:!!itemSubDone(s.ref,sub.id),ref:s.ref,subId:sub.id,kind:s.kind,source:'auto'});
          changed=true;
        }
      });
    }else{
      if(dis.indexOf(s.ref)>=0)return;
      if(!l.find(x=>x.source==='auto'&&x.ref===s.ref&&!x.subId)){
        l.push({id:uid(),text:`${s.name}（${s.hours}h）`,done:false,ref:s.ref,kind:s.kind,source:'auto'});
        changed=true;
      }
    }
  });
  if(changed)save();
}
/* 读父任务里某条子任务的完成态（渲染前对齐） */
function itemSubDone(ref,subId){
  const t=taskOfRef(ref);if(!t)return false;
  const st=(t.subtasks||[]).find(s=>s.id===subId);
  return !!(st&&st.done);
}
/* 一键把「今天这几条」子任务全部标记完成（父任务进度随之推进） */
function doneAllSubs(ds,ref){
  const kids=todoList(ds).filter(x=>x.ref===ref&&x.subId);
  if(!kids.length)return;
  kids.forEach(x=>x.done=true);
  const t=taskOfRef(ref);
  if(t){
    kids.forEach(x=>{const st=(t.subtasks||[]).find(s=>s.id===x.subId);if(st)st.done=true});
    if(t.subtasks&&t.subtasks.length&&t.subtasks.every(s=>s.done))t.done=true;
  }
  save();renderTodo(false);
  toast('今天这几条已全部完成');
}
function todoItemHTML(ds,x,compact){
  const item=x.ref?itemByRef(x.ref):null;
  return`<div class="todo-item ${x.done?'done':''}" style="${compact?'margin:6px 0 0;padding:7px 10px':''}">
    <button class="chk ${x.done?'on':''}" onclick="toggleTodo('${ds}','${x.id}')">${x.done?'✓':''}</button>
    <div class="t" style="${compact?'font-size:13px':''}">${esc(x.text)}
      ${x.subId?'':((x.kind==='work')?`<span class="tag pink"><i class="ic" data-ic="camera"></i> 工作</span>`:(item?`<span class="tag gray" style="color:${item.color}">${esc(item.sub)}</span>`:((x.kind||'study')==='study'?'<span class="tag gray">学习</span>':'')))}
    </div>
    ${!x.subId&&item&&item.kind==='work'?`<span class="muted" style="white-space:nowrap">阶段 ${stageLabel(item.stage)}</span>`:''}
    <button class="btn danger sm" onclick="delTodo('${ds}','${x.id}')">删</button>
  </div>`;
}
/* 把当天的待办按「任务」聚成组：父任务一行（含进度/工时）+ 子任务若干行。
   没有子任务的条目单独成组，仍显示任务标题。顺序沿用 dpSug，保证与建议一致。 */
function groupTodos(ds){
  const list=todoList(ds).filter(x=>passFilter(x.kind||'study'));
  const sug=dpSug(ds);
  const groups=[],seen={};
  const push=ref=>{
    if(seen[ref])return;
    seen[ref]=true;
    const kids=list.filter(x=>x.ref===ref);
    if(!kids.length)return;
    const kidsBySub=kids.filter(x=>x.subId);
    // 有子任务条目 ⇒ 父行只做标题，子任务逐条列；否则父行本身就是可勾选的一条
    const task=kids.find(x=>!x.subId);
    groups.push({ref,kids,kidsBySub,task,kid:kids[0]});
  };
  sug.forEach(s=>push(s.ref));
  list.forEach(x=>push(x.ref)); // 兜底：建议里没有但待办里存在的
  return groups;
}
function renderDay(){
  computeDP();
  matSug(todoDate);
  const groups=groupTodos(todoDate);
  const sug=dpSug(todoDate);
  const hStudy=sug.filter(s=>s.kind==='study').reduce((a,b)=>a+b.hours,0);
  const hWork=sug.filter(s=>s.kind==='work').reduce((a,b)=>a+b.hours,0);
  // 完成计数：有子任务的按子任务条数算，没有的按条目算
  let doneN=0,totalN=0;
  groups.forEach(g=>{
    const rows=g.kidsBySub.length?g.kidsBySub:[g.task].filter(Boolean);
    rows.forEach(x=>{totalN++;if(x.done)doneN++});
  });
  const body=groups.map(g=>{
    const first=g.kid;
    const item=first.ref?itemByRef(first.ref):null;
    if(!g.kidsBySub.length){
      // 没有子任务：单行显示（勾选整条任务）
      return todoItemHTML(todoDate,g.task||first);
    }
    const task=taskOfRef(g.ref);
    const p=item?item.progress:0;
    const color=(item&&item.color)||'#9d8cd2';
    const dn=g.kidsBySub.filter(x=>x.done).length;
    const subAll=(task&&task.subtasks)||[];
    const pendSub=subAll.filter(s=>!s.done).length;          // 整个任务还没做完的子任务
    const restDays=pendSub-g.kidsBySub.filter(x=>!x.done).length; // 除今天外还排在后面的条数
    const allDone=dn===g.kidsBySub.length;
    return`<div class="task-group">
      <div class="tg-head">
        <span class="tg-dot" style="background:${color}"></span>
        <b>${esc(item?item.name:first.text.replace(/（[\d.]+h）$/,''))}</b>
        ${item?`<span class="tag gray" style="color:${color}">${esc(item.sub)}</span>`:''}
        <span class="muted" style="margin-left:auto;white-space:nowrap">今天 ${dn}/${g.kidsBySub.length} 条 · 总进度 ${p}%</span>
        <button class="btn ghost sm" style="flex:none" title="把今天这几条一次性标记完成" onclick="doneAllSubs('${todoDate}','${g.ref}')" ${allDone?'disabled':''}>今天全做完</button>
      </div>
      <div class="tg-subs">
        ${g.kidsBySub.map(x=>`<div class="todo-item sub ${x.done?'done':''}">
          <button class="chk ${x.done?'on':''}" onclick="toggleTodo('${todoDate}','${x.id}')">${x.done?'✓':''}</button>
          <div class="t">${esc(x.text)}</div>
          <button class="btn danger sm" onclick="delTodo('${todoDate}','${x.id}')">删</button>
        </div>`).join('')}
        ${g.kids.filter(x=>!x.subId).map(x=>todoItemHTML(todoDate,x)).join('')}
      </div>
      ${restDays>0?`<div class="muted tg-more">这个任务还有 ${restDays} 条子任务排在后面几天，跟着截止日期自动往前推</div>`:''}
    </div>`;
  }).join('');
  const html=`<div class="card">
    <h2 style="margin-top:0"><i class="ic" data-ic="calendar"></i> ${fmtMD(todoDate)} 周${wk(todoDate)} <span class="muted">第${teachWeek(todoDate)||'—'}教学周 · 完成 ${doneN}/${totalN}</span></h2>
    <div class="legend">
      <span><i style="background:#9d8cd2"></i>学习 ${hStudy.toFixed(1)}h</span>
      <span><i style="background:${WORK_COLOR}"></i>工作 ${hWork.toFixed(1)}h</span>
      <b>合计 ${(hStudy+hWork).toFixed(1)}h</b>
    </div>
    ${groups.length?body:`<div class="empty">今天没有安排的任务 <i class="ic" data-ic="cup"></i><br><span class="muted">任务会按截止日期自动分配到每天，也可以点右上角手动添加</span></div>`}
  </div>`;
  $('#todo-body').innerHTML=html;
}
function renderWeek(){
  computeDP();
  const ws=todoWkStart||weekStartOf(todayStr());
  const days=[...Array(7)].map((_,i)=>d2s(addDays(s2d(ws),i)));
  // 本周应处理的条目（建议 + 截止在本周），学习与工作统一
  const allItems=allPlanItems();
  const dueInWeek=allItems.filter(t=>!t.done&&t.dueDate>=days[0]&&t.dueDate<=days[6]).sort((a,b)=>a.dueDate<b.dueDate?-1:1);
  let sugRefs=new Set();days.forEach(ds=>dpSug(ds).forEach(s=>sugRefs.add(s.ref)));
  const sugItems=allItems.filter(t=>!t.done&&sugRefs.has(t.ref)&&!dueInWeek.find(x=>x.ref===t.ref));
  let total=0,done=0;days.forEach(ds=>todoList(ds).forEach(x=>{if(passFilter(x.kind)){total++;if(x.done)done++}}));
  const html=`<div class="grid" style="grid-template-columns:1.4fr 1fr">
  <div class="card">
    <h2 style="margin-top:0"><i class="ic" data-ic="calendar"></i> ${fmtMD(days[0])} ~ ${fmtMD(days[6])} <span class="muted">第${teachWeek(days[0])||'—'}教学周 · 待办完成 ${done}/${total}</span></h2>
    ${days.map(ds=>{
      const l=todoList(ds).filter(x=>passFilter(x.kind||'study'));
      const sg=dpSug(ds);const h=sg.reduce((a,b)=>a+b.hours,0);
      const hs=sg.filter(s=>s.kind==='study').reduce((a,b)=>a+b.hours,0);
      const hw=sg.filter(s=>s.kind==='work').reduce((a,b)=>a+b.hours,0);
      return`<div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <b style="${ds===todayStr()?'color:var(--accent)':''}">${fmtMD(ds)} 周${wk(ds)}${ds===todayStr()?' · 今天':''}</b>
          ${h?`<span class="muted">建议 ${h.toFixed(1)}h${hw?`（学习 ${hs.toFixed(1)} / 工作 ${hw.toFixed(1)}）`:''}</span>`:'<span class="muted">无安排</span>'}
        </div>
        ${l.length?l.map(x=>x.subId
            ?`<div class="todo-item sub ${x.done?'done':''}" style="margin:5px 0 0 14px;padding:6px 10px">
                <button class="chk ${x.done?'on':''}" onclick="toggleTodo('${ds}','${x.id}')">${x.done?'✓':''}</button>
                <div class="t" style="font-size:12.5px">${esc(x.text)}</div>
                <button class="btn danger sm" onclick="delTodo('${ds}','${x.id}')">删</button>
              </div>`
            :todoItemHTML(ds,x,true)).join(''):'<div class="muted" style="padding:4px 0 0 2px">—</div>'}
      </div>`}).join('')}
  </div>
  <div>
    <div class="card" style="margin-bottom:16px">
      <h2 style="margin-top:0"><i class="ic" data-ic="clock"></i> 本周截止</h2>
      ${dueInWeek.length?dueInWeek.map(t=>planRowHTML(t)).join(''):'<div class="muted">本周没有任务截止</div>'}
    </div>
    <div class="card">
      <h2 style="margin-top:0"><i class="ic" data-ic="star4"></i> 本周建议推进（未到截止）</h2>
      ${sugItems.length?sugItems.map(t=>{
        const hrs=days.reduce((a,ds)=>a+dpSug(ds).filter(s=>s.ref===t.ref).reduce((x,y)=>x+y.hours,0),0);
        return`<div class="task-row"><div style="flex:1;min-width:0;cursor:pointer" onclick="${t.kind==='work'?`projectModal('${t.pid}')`:`taskModal('${t.id}')`}">
          <b>${esc(t.name)}</b>${t.kind==='work'?' <span class="tag pink">工作</span>':''}
          <div class="muted">${esc(t.sub)} · 截止 ${fmtMD(t.dueDate)} · 本周建议投入 ${hrs.toFixed(1)}h</div></div>
          <div class="bar-mini" style="max-width:80px"><i style="width:${t.progress}%;background:${t.color}"></i></div>

function incomeOfProject(pid){return (S.income||[]).filter(x=>x.projectId===pid).reduce((a,b)=>a+(+b.amount||0),0)}
function projectProgress(p){
  const st=WORK_STAGES.map(s=>(p.stages&&p.stages[s.key])||{});
  const done=st.filter(x=>x.status===2).length;
  const active=st.filter(x=>x.status===1).length;
  return Math.round(100*(done+active*0.5)/4);
}
function stagePlan(startStr,deliverStr){
  const weights=[0.15,0.45,0.78,1];
  const span=Math.max(1,daysBetween(startStr,deliverStr));
  const out={};
  WORK_STAGES.forEach((s,i)=>{out[s.key]={est:[2,3,3,2][i],due:d2s(addDays(s2d(startStr),Math.round(span*weights[i]))),status:0,progress:0}});
  return out;
}
function cycleStage(pid,key){
  const p=(S.projects||[]).find(x=>x.id===pid);if(!p)return;
  const st=p.stages[key]||(p.stages[key]={est:4,due:'',status:0,progress:0});
  st.status=st.status===0?1:(st.status===1?2:0);
  if(st.status===2)st.progress=100;else if(st.status===1)st.progress=st.progress||50;else st.progress=0;

/* ---- 工作项目导入：本地规则识别 / AI 解析 / JSON ---- */
function normDate(s){
  let y=null,m=0,d=0;
  const ymd=s.match(/(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})/);
  if(ymd){y=+ymd[1];m=+ymd[2];d=+ymd[3]}
  else{const md=s.match(/(\d{1,2})\s*[月\/\-]\s*(\d{1,2})/);if(md){y=new Date().getFullYear();m=+md[1];d=+md[2]}}
  if(!y||!m||!d)return'';
  const ds=`${y}-${pad(m)}-${pad(d)}`;
  if(ds<todayStr()){ // 已过则视为明年
    const nx=`${y+1}-${pad(m)}-${pad(d)}`;
    return nx;
  }
  return ds;
}
function guessType(name){
  if(/广告|商单|宣传|TVC/.test(name))return'品牌广告';
  if(/探店/.test(name))return'探店笔记';
  if(/种草/.test(name))return'产品种草';
  if(/vlog|Vlog|日常/.test(name))return'Vlog';
  if(/直播/.test(name))return'直播';
  return'图文笔记';
}
function parseWorkText(text){
  const out=[];
  text.split('\n').map(s=>s.trim()).filter(Boolean).forEach(line=>{
    let name=line,fee=0,date='';
    const dm=line.match(/(\d{4}[-\/年])?\d{1,2}\s*[月\/\-]\s*\d{1,2}\s*[日号]?/);
    if(dm){date=normDate(dm[0]);name=name.replace(dm[0],' ')}
    const fm=line.match(/(?:¥|￥|报价|费用|预算|稿费)\s*(\d{2,6}(?:\.\d+)?)|(\d{2,6}(?:\.\d+)?)\s*(?:元|块|RMB|rmb|¥|￥)/);
    if(fm){fee=parseFloat(fm[1]||fm[2]);name=name.replace(fm[0],' ')}
    name=name.replace(/[，,、;；:：|]+$/,'')
             .replace(/\s*(前提交|前交|提交|交付|截止|前完成|完成|deadline|DDL)\s*/gi,' ')
             .replace(/\s*(元|块|人民币|RMB|rmb|¥|￥|左右)\s*/g,' ')
             .replace(/\s+(前|要|需|需交)\s*$/,'')
             .replace(/\s+/g,' ').trim();
    if(!name)return;
    out.push({name,brand:'',type:guessType(name),deliverDate:date||d2s(addDays(s2d(todayStr()),14)),fee,estHours:10});
  });
  return out;
}

function totalIncome(){return (S.income||[]).reduce((a,b)=>a+(+b.amount||0),0)}
function receivable(){return (S.projects||[]).reduce((a,p)=>a+Math.max(0,(+p.fee||0)-incomeOfProject(p.id)),0)}
function monthIncome(mon){return (S.income||[]).filter(x=>(x.date||'').indexOf(mon)===0).reduce((a,b)=>a+(+b.amount||0),0)}
const MILESTONES=[500,1000,2000,3000,5000,8000,10000,20000,50000,100000];
function piggySVG(pct){
  const cx=160,cy=152,rx=92,ry=62,maxRows=6;
  const filled=maxRows*Math.min(100,pct)/100;
  const coins=[];
  for(let r=0;r<maxRows;r++){
    const f=Math.max(0,Math.min(1,filled-r));
    if(f<=0)break;
    const y=cy+ry-14-r*17;
    const count=Math.max(1,Math.round(7*f));
    const x0=cx-(count-1)*11;
    for(let i=0;i<count;i++){
      const x=x0+i*22;
      coins.push(`<circle cx="${x}" cy="${y}" r="9.5" fill="#f7c948" stroke="#dfa61f" stroke-width="2"/>
      <circle cx="${x}" cy="${y}" r="4" fill="none" stroke="#e5b52c" stroke-width="1.5"/>`);
    }
  }
  const drop=window.__coinDrop?[0,1,2].map((i)=>`<g class="coin-fall" style="animation-delay:${i*0.12}s">

function countUp(el,to){
  const from=(window.__prevTotal==null)?0:window.__prevTotal;
  window.__prevTotal=to;
  const dur=900,t0=performance.now();
  (function step(t){
    const k=Math.min(1,(t-t0)/dur);
    const v=from+(to-from)*(1-Math.pow(1-k,3));
    el.textContent='¥'+Math.round(v).toLocaleString();
    if(k<1)requestAnimationFrame(step);
  })(t0);
}

function lastMonths(n){
  const out=[];const d=new Date();
  for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(x.getFullYear()+'-'+pad(x.getMonth()+1))}
  return out;
}

/* ================= 时间线（甘特图，内嵌在规划页） ================= */
function ganttHTML(){
  const start=s2d(S.semester.start),end=s2d(S.semester.end);
  let maxDue=S.semester.end;
  allPlanItems().forEach(it=>{if(it.dueDate>maxDue)maxDue=it.dueDate});
  const total=Math.max(1,daysBetween(S.semester.start,maxDue));
  const projs=S.projects||[];
  const rows=S.tasks.length+projs.length+1;
  const LBL=150;   // 左侧固定一列放任务名：名字不再压在时间条上（学期初开始的任务原来必糊）
  const W=1080,lh=34,top=34,H=top+rows*lh+30;
  const x=ds=>LBL+(daysBetween(S.semester.start,ds)/total)*(W-LBL-12);
  const clip=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};   // 先截断再转义，别把 &amp; 切一半
  const pctTxt=(x2,y,w,pct)=>w>=44
    ?`<text x="${x2-8}" y="${y+12}" font-size="10" text-anchor="end" fill="#fff" fill-opacity="0.85">${pct}%</text>`
    :`<text x="${Math.min(W-34,x2+8)}" y="${y+12}" font-size="10" fill="#c9a2b4">${pct}%</text>`;
  let grid='',bands='';
  const totalWeeks=Math.ceil(total/7);
  for(let w=0;w<=totalWeeks;w+=2){
    const ds=d2s(addDays(start,w*7));const px=Math.min(W-12,x(ds));
    grid+=`<line x1="${px}" y1="20" x2="${px}" y2="${H-24}" stroke="#f6e3ed" stroke-width="1"/>
    <text x="${px+3}" y="14" font-size="10" fill="#c9a2b4">第${w+1}周</text>`;
  }
  for(let r=0;r<rows;r+=2)bands+=`<rect x="${LBL-6}" y="${top+r*lh-5}" width="${W-LBL-8}" height="${lh-4}" fill="#ffffff" opacity="0.38"/>`;
  let i=0;
  const bars=S.tasks.map(t=>{
    const st=t.startDate&&t.startDate>S.semester.start?t.startDate:S.semester.start;
    const x1=x(st),x2=Math.max(x1+8,x(t.dueDate)+6);const y=top+i*lh;i++;
    const late=!t.done&&t.dueDate<todayStr();
    const rep=isRepeatTask(t);
    const wds=rep?'每周'+WEEKDAY_NAMES[t.repeat.weekday].slice(1):'';   // 「每周二」，别和 WEEKDAY_NAMES 的「周」前缀重复
    // 重复任务：条画成虚线框（=重复区间），每个发生日画实心圆点
    const bar=rep
      ?`<rect x="${x1}" y="${y}" width="${x2-x1}" height="16" rx="8" fill="${courseColor(t.courseId)}" fill-opacity="0.16" stroke="${courseColor(t.courseId)}" stroke-width="1.4" stroke-dasharray="4 2">
        <title>${esc(t.name)} | ${wds} · 到 ${fmtMD(t.dueDate)} · 每次约 ${t.estHours||0.5}h</title>
      </rect>`
      :`<rect x="${x1}" y="${y}" width="${x2-x1}" height="16" rx="8" fill="${late?'#f0a4b8':courseColor(t.courseId)}" opacity="${t.done?0.35:0.85}">
        <title>${esc(t.name)} | ${fmtMD(st)} ~ ${fmtMD(t.dueDate)} | 进度 ${taskProgress(t)}%</title>
      </rect>`;
    const dots=rep?repeatDates(t).map(ds=>`<circle cx="${x(ds)}" cy="${y+8}" r="4" fill="${courseColor(t.courseId)}" stroke="#fff" stroke-width="1.5"><title>${wds} · ${fmtMD(ds)}${ds===todayStr()?'（今天）':''}</title></circle>`).join(''):'';
    return`<g>
      <text x="${LBL-10}" y="${y+12}" font-size="11" text-anchor="end" fill="#96707f">${esc(clip(t.name,10))}<title>${esc(t.name)} · ${rep?`${wds} · 到 ${fmtMD(t.dueDate)}`:`${fmtMD(st)} ~ ${fmtMD(t.dueDate)}`}</title></text>
      ${bar}
      ${dots}
      ${rep?'':pctTxt(x2,y,x2-x1,taskProgress(t))}
    </g>`}).join('');
  const workBars=projs.map(p=>{
    const st=p.startDate&&p.startDate>S.semester.start?p.startDate:S.semester.start;
    const x1=x(st),x2=Math.max(x1+10,x(p.deliverDate)+6);const y=top+i*lh;i++;
    const pp=projectProgress(p);
    const marks=WORK_STAGES.map(s=>{
      const std=(p.stages&&p.stages[s.key])||{};
      if(!std.due)return'';
      const mx=x(std.due);const fill=std.status===2?'#d15c8f':(std.status===1?'#fff':'#ffffffcc');
      return`<circle cx="${mx}" cy="${y+8}" r="5.5" fill="${fill}" stroke="${WORK_COLOR}" stroke-width="2">
        <title>${s.label} · ${fmtMD(std.due)} · ${std.status===2?'已完成':std.status===1?'进行中':'未开始'}</title></circle>`;
    }).join('');
    return`<g>
      <text x="${LBL-10}" y="${y+12}" font-size="11" text-anchor="end" fill="#96707f">${esc(clip(p.name,10))}<title>小红书 · ${esc(p.name)} · 交稿 ${fmtMD(p.deliverDate)}</title></text>
      <rect x="${x1}" y="${y}" width="${x2-x1}" height="16" rx="8" fill="${WORK_COLOR}" opacity="0.85">
        <title>${esc(p.name)} | 交稿 ${fmtMD(p.deliverDate)} | 进度 ${pp}% ${p.fee?'| 报价 ¥'+p.fee:''}</title>
      </rect>
      ${marks}
      ${pctTxt(x2,y,x2-x1,pp)}
    </g>`}).join('');
  const tx=Math.max(LBL,Math.min(W-12,x(todayStr())));
  const legend=S.courses.map(c=>`<span><i style="background:${c.color}"></i>${esc(c.name)}</span>`).join('')
    +(S.tasks.some(isRepeatTask)?'<span><i style="background:#d15c8f;border-radius:50%"></i>实心圆点=每周重复发生</span>':'')
    +(projs.length?`<span><i style="background:${WORK_COLOR}"></i>小红书工作（圆点=四阶段）</span>`:'')
    +`<span><i style="background:#f0a4b8"></i>已逾期</span>`;
  return`
  <div class="legend">${legend}</div>
  <div class="card" style="overflow-x:auto">
  ${(S.tasks.length||projs.length)?`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="min-width:${W}px">
    ${bands}${grid}
    <line x1="${tx}" y1="18" x2="${tx}" y2="${H-24}" stroke="#d96d85" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="${tx+4}" y="28" font-size="10" fill="#d96d85" font-weight="700">今天</text>
    ${bars}${workBars}
  </svg>`:'<div class="empty">暂无任务数据</div>'}
  </div>`;
}

/* ================= 文档解析（PDF / 文本） ================= */
function pdfReady(){
  if(typeof pdfjsLib==='undefined')return false;
  if(!pdfReady._init){try{pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js';pdfReady._init=true}catch(e){return false}}
  return true;
}
async function pdfToText(file){
  if(!pdfReady())throw new Error('PDF 解析组件没加载成功，请刷新页面后重试');
  const buf=await file.arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:buf}).promise;
  const total=doc.numPages,pages=Math.min(total,40);
  let out='';
  for(let i=1;i<=pages;i++){
    const page=await doc.getPage(i);
    const tc=await page.getTextContent();
    // 按纵坐标断行，尽量还原原文换行
    const lines=[];let line='',lastY=null;
    tc.items.forEach(it=>{
      const y=(it.transform&&it.transform.length>=6)?Math.round(it.transform[5]):null;
      if(lastY!==null&&y!==null&&Math.abs(y-lastY)>2){lines.push(line);line=''}
      line+=it.str||'';lastY=y;
    });
    if(line)lines.push(line);
    out+=(i>1?'\n':'')+'【第 '+i+' 页】\n'+lines.join('\n');
  }
  if(total>pages)out+='\n\n（文档共 '+total+' 页，已提取前 '+pages+' 页）';
  return out.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
async function readTextFile(file){
  const buf=await file.arrayBuffer();
  let s=new TextDecoder('utf-8').decode(buf);
  const bad=(s.match(/\uFFFD/g)||[]).length;
  if(bad>0&&bad>s.length*0.02){        // 疑似 GBK 编码的中文文本
    try{const alt=new TextDecoder('gbk').decode(buf);if((alt.match(/\uFFFD/g)||[]).length<bad)s=alt}catch(e){}
  }
  return s;
}
/* ===== Word / PPT / Excel 文字提取 =====
   .docx/.pptx/.xlsx 本质是 ZIP+XML：用本地 vendor/jszip.min.js 解包（与 pdf.js 一样离线可用），
   按段落还原换行后剥掉 XML 标签。旧版二进制 .doc/.ppt 不是 zip，走 legacyOfficeToText 粗提取。 */
function unescXml(s){
  return String(s).replace(/&#x([0-9a-fA-F]+);/g,(_,h)=>String.fromCodePoint(parseInt(h,16)))
    .replace(/&#(\d+);/g,(_,d)=>String.fromCodePoint(+d))
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'")
    .replace(/&amp;/g,'&');
}
function xmlToText(xml){   // 段落→换行、表格单元格/制表→\t，其余标签剥掉
  return unescXml(String(xml)
    .replace(/<\/w:p>/g,'\n').replace(/<w:p\b[^>]*\/>/g,'\n')
    .replace(/<\/a:p>/g,'\n').replace(/<a:p\b[^>]*\/>/g,'\n')
    .replace(/<w:tab\b[^>]*\/>/g,'\t').replace(/<a:tab\b[^>]*\/>/g,'\t')
    .replace(/<w:br\b[^>]*\/>/g,'\n').replace(/<a:br\b[^>]*\/>/g,'\n')
    .replace(/<\/w:tc>/g,'\t')
    .replace(/<[^>]+>/g,''))
    .replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').replace(/^\n+/,'').trim();
}
function zipReady(){if(typeof JSZip==='undefined')throw new Error('本地组件 jszip 未加载（app/vendor/jszip.min.js 缺失，或页面缓存未刷新）')}
async function zipDocText(file,re){
  zipReady();
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const names=Object.keys(zip.files).filter(n=>re.test(n)&&!zip.files[n].dir)
    .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));   // slide2 排在 slide10 前面
  if(!names.length)throw new Error('文件里找不到正文（可能不是标准的 Office 文件）');
  let out='';
  for(const n of names)out+=xmlToText(await zip.files[n].async('string'))+'\n\n';
  return out.trim();
}
async function docxToText(file){return zipDocText(file,/^word\/(document|header\d*|footer\d*)\.xml$/i)}
async function pptxToText(file){return zipDocText(file,/^ppt\/slides\/slide\d+\.xml$/i)}
async function xlsxToText(file){return zipDocText(file,/^xl\/sharedStrings\.xml$/i)}
async function legacyOfficeToText(file){   // 旧版 .doc/.ppt：二进制里捞可读片段（效果有限，提示用户转新格式）
  if(typeof TextDecoder==='undefined')return '';
  const buf=await file.arrayBuffer();
  const run=/(?:[\u4e00-\u9fff\u3400-\u4dbf]|[A-Za-z0-9，。、；：！？（）【】《》“”‘’%·…\-\/ ]){5,}/g;
  let best='';
  for(const enc of['utf-16le','gbk','utf-8']){
    let s='';try{s=new TextDecoder(enc).decode(buf)}catch(e){continue}
    const cand=(s.match(run)||[]).join('\n');
    if(cand.length>best.length)best=cand;
  }
  return best;
}
async function attachSyllabus(inp,targetId,noteId){
  const f=inp.files&&inp.files[0];if(!f)return;
  inp.value='';
  const ta=document.getElementById(targetId);
  const note=noteId?document.getElementById(noteId):null;
  const say=m=>{if(note)note.textContent=m};
  const mb=f.size/1024/1024;
  try{
    let text='';
    const nm=(f.name||'').toLowerCase();
    const legacy=/\.(doc|ppt)$/.test(nm);
    if(/\.pdf$/.test(nm)||f.type==='application/pdf'){
      say('正在提取 PDF 文字…（'+f.name+'，'+mb.toFixed(1)+' MB）'+(mb>5?'，文件较大请稍候':''));
      text=await pdfToText(f);
    }else if(/\.docx$/.test(nm)){
      say('正在提取 Word 文字…（'+f.name+'，'+mb.toFixed(1)+' MB）'+(mb>5?'，文件较大请稍候':''));
      text=await docxToText(f);
    }else if(/\.pptx$/.test(nm)){
      say('正在提取 PPT 文字…（'+f.name+'，'+mb.toFixed(1)+' MB）'+(mb>5?'，文件较大请稍候':''));
      text=await pptxToText(f);
    }else if(/\.xlsx$/.test(nm)){
      say('正在提取 Excel 文字…（'+f.name+'）');
      text=await xlsxToText(f);
    }else if(legacy){
      say('正在读取 '+f.name+' …（旧版格式，提取效果有限）');
      text=await legacyOfficeToText(f);
    }else{
      say('正在读取 '+f.name+' …');
      text=await readTextFile(f);
    }
    text=(text||'').trim();
    if(!text){say('⚠️ 没提取到文字。若这是扫描件 / 图片型文档（整页是图片），需要先做文字识别；旧版 .doc/.ppt 建议另存为 .docx/.pptx 或 PDF。也可以直接手动粘贴。');return}
    if(ta){
      const cur=ta.value.trim();
      ta.value=cur?cur+'\n\n'+text:text;
      say('✅ 已提取 '+text.length+' 字并填入文本框（来自 '+f.name+'）。'+(legacy?'旧版格式提取效果有限，若文字缺漏，建议另存为 .docx/.pptx 或 PDF 再传一次。':'')+'核对无误后记得保存。');
    }
  }catch(e){say('❌ 读取失败：'+((e&&e.message)||e))}
}

/* ================= 粘贴图片识别（课程 + 任务）=================

const IMG_MAX=6;          // 一次最多几张
let IMG_LIST=[];          // [{idUrl,dataUrl,name}]
const IMG_VISION_HINT='<b>提示</b>：图片识别需要模型本身支持「看图」。若提示接口不接受图片，请到「设置」把模型换成支持视觉的（如 gpt-4o / gpt-4o-mini / qwen-vl-plus / glm-4v 等），或改用「AI 解析课程大纲」粘贴文字、上传文件（PDF / Word / PPT）。';

function imgNote(m,cls){

function onPasteImage(e){
  const dt=e.clipboardData;if(!dt)return;
  const items=dt.items?[...dt.items]:[];
  const imgs=items.filter(it=>it.kind==='file'&&/^image\//.test(it.type||''));
  let files=imgs.map(it=>it.getAsFile()).filter(Boolean);
  if(!files.length&&dt.files&&dt.files.length){
    files=[...dt.files].filter(f=>/^image\//.test(f.type||''));
  }
  if(!files.length){imgNote('剪贴板里没有图片。请先用截图工具截图（或复制图片），再回到这个框里按 Ctrl+V。','bad');return}
  e.preventDefault();e.stopPropagation();
  addImages(files);
}
function imgFromFiles(fl){
  const files=fl?[...fl].filter(f=>/^image\//.test(f.type||'')):[];
  if(!files.length){imgNote('这些不是图片文件（只支持 png / jpg / webp 等）。','bad');return}
  addImages(files);
}
function addImages(files){
  const room=IMG_MAX-IMG_LIST.length;
  if(room<=0){imgNote('最多 '+IMG_MAX+' 张，请先删掉几张再添加。','bad');return}
  const take=files.slice(0,room);
  let left=take.length;
  take.forEach((f,i)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      IMG_LIST.push({idUrl:'img'+Date.now()+'_'+i+Math.random().toString(36).slice(2,5),dataUrl:fr.result,name:f.name||('图片'+(IMG_LIST.length+1))});
      if(--left===0){
        imgRenderPv();
        imgNote('✅ 已添加 '+take.length+' 张，共 '+IMG_LIST.length+' 张。点下方「开始识别」。','ok');
      }
    };
    fr.onerror=()=>{if(--left===0)imgRenderPv();imgNote('有图片读取失败，请重试。','bad')};
    fr.readAsDataURL(f);
  });
}

/* 把一批图片交给模型：多模态时用 content 数组，失败且未指定格式时自动退回纯字符串 */
async function callAIImages(prompt,imgs){
  const a=S.settings.ai;
  if(MODE!=='server'){
    // 网页版（云端/本机模式）直连：接口需允许浏览器跨域（DeepSeek 已实测支持），且模型要能看图。
    // imageFormat 兜底是本地服务特有参数，直连走标准 OpenAI vision 形状
    const content=[{type:'text',text:prompt}].concat(imgs.map(im=>({type:'image_url',image_url:{url:im.dataUrl}})));
    let r;
    try{
      r=await fetch(a.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+a.key},
        body:JSON.stringify({model:a.model,messages:[{role:'user',content:content}],temperature:0.1})});
    }catch(e){
      throw new Error('浏览器直连 AI 接口失败（跨域拦截或网络不通）。DeepSeek 接口支持直连，请检查接口地址；或改在电脑上用本地服务版识别');
    }
    let j=null;try{j=await r.json()}catch(e){}
    if(!r.ok)throw new Error((j&&j.error&&j.error.message)||('接口返回 HTTP '+r.status));
    const c=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
    if(!c||/tool_use_failed|not supported|不支持|fail_to_fetch_image|没有识别到内容/i.test(c)){
      throw new Error('模型没有返回有效的识别结果——多半是纯文本模型看不了图。换支持视觉的模型（网页版可将接口换成多模态服务），或把截图发到 WorkBuddy 对话里由 AI 解析后用「导入任务 JSON」导入');
    }
    return c;
  }
  const content=[{type:'text',text:prompt}].concat(imgs.map(im=>({type:'image_url',image_url:{url:im.dataUrl}})));
  const once=async fmt=>{
    const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({endpoint:a.endpoint,key:a.key,model:a.model,prompt,content,imageFormat:fmt,temperature:0.1})});
    if(!r.ok)throw new Error('本机数据服务返回 HTTP '+r.status);
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'识别失败');
    return {content:j.content||'',sent:j.sent||''};
  };
  let res=await once(undefined);
  if(!res.sent&&/tool_use_failed|not supported|不支持|fail_to_fetch_image|没有识别到内容/i.test(res.content)){
    res=await once('input_text');
  }
  return res.content;
}
async function runImageParse(){
  const btn=$('#img-run');
  if(!IMG_LIST.length){imgNote('还没有图片。请先截图，再在这个框里按 Ctrl+V 粘贴。','bad');return}
  const a=S.settings.ai;
  if(!a.key){imgNote('还没配置 AI 接口。请到「设置 → AI 解析设置」填接口地址和 Key（图片识别必须走 AI）。','bad');return}
  if(btn){btn.disabled=true;btn.textContent='识别中…'}
  $('#img-result').innerHTML='<div class="muted">正在识别图片，通常需要几秒到十几秒，请稍候…</div>';
  const prompt=`你是教务助理。请阅读用户提供的图片（课程表截图 / 教务系统截图 / 老师发的作业通知等），提取其中的大学课程与硬性任务。

输出严格的 JSON 对象，不要输出任何其他文字、不要用代码块。格式：
{"courses":[{"name":"课程名称","teacher":"教师，没有则空串","schedule":"上课时间，如 周一 3-4 节，没有则空串"}],
 "tasks":[{"courseName":"所属课程名称，必须与上面 courses 里的名称一致","name":"任务名","type":"考试|作业|实验|报告|项目|答辩|预习/阅读|其他","weight":0,"dueDate":"YYYY-MM-DD","estHours":4,"repeat":"","weekday":0,"notes":"硬性要求摘要，如闭卷、字数要求、小组","subtasks":["准备步骤1","准备步骤2"]}]}

要求：
1. 图片里出现几门课就写几门；看不清的字段留空串或 0，不要瞎编。
2. dueDate 一律 YYYY-MM-DD。图片只给「第N周」或「M月D日」时，请换算：本学期开始 ${S.semester.start}（第1教学周起点），结束 ${S.semester.end}，今天是 ${todayStr()}。只给周次时按该教学周的周日折算。
3. weight 是考核占比数字（如 30），没有就给 0。
4. estHours 是预计投入小时数，按常理估（考试 10-30，作业 2-6，实验 4-10）；每周重复的任务填每次用时。
5. repeat：任务每周固定重复（如每周小测、每周交作业）时输出 "weekly"，并给 weekday（0=周日，1=周一，2=周二…6=周六）；一次性任务输出 ""。
6. **subtasks 最重要**：这些会直接变成学生每天的待办事项，必须拆成「当天能动手做完的具体动作」，不能是任务标题的换一种说法。
   - 每条带动作动词 + 明确范围/数量，看完就知道要干什么、干完没有。如「复习第 1-3 章并整理公式卡」「做 2020-2023 共 4 套真题」「写 300 字报告提纲」。
   - 禁止出现「复习」「准备考试」「写报告」这类笼统说法。
   - 按真实工作量拆 3-8 条，覆盖准备→执行→收尾，条与条不重复，顺序即推进顺序。
   - 图片里信息不足以拆解时，就按这类任务的常识拆分；实在无法拆给空数组。
7. 图片里如果只是纯文字没有表格，也同样按上面结构输出。
8. 什么都识别不出来时，输出 {"courses":[],"tasks":[]}。`;
  try{
    const raw=await callAIImages(prompt,IMG_LIST);
    const obj=pickResultJSON(raw);
    const courses=Array.isArray(obj.courses)?obj.courses:[];
    const tasks=Array.isArray(obj.tasks)?obj.tasks:[];
    if(!courses.length&&!tasks.length)throw new Error('图片里没识别出课程或任务，换一张更清晰的截图再试试');
    imgShowResult(courses,tasks);
  }catch(e){
    $('#img-result').innerHTML=`<div class="tip" style="background:#fdeef2;border-color:#f7d4de;color:#c9566f">识别失败：${esc((e&&e.message)||e)}<br>${IMG_VISION_HINT}</div>`;
  }
  if(btn){btn.disabled=false;btn.innerHTML='<i class="ic" data-ic="wand"></i> 开始识别'}
}
/* 容错解析：对象 / 数组 / 代码块包裹 / 前后夹带文字 都能捞出来 */
function pickResultJSON(content){
  let txt=String(content==null?'':content).replace(/```json|```/g,'```').replace(/```[a-zA-Z]*\s*/g,'').trim();
  if(!txt)throw new Error('模型没有返回内容（可能模型不支持图片输入）');
  const cand=[];
  const ob=txt.match(/\{[\s\S]*\}/);if(ob)cand.push(ob[0]);
  const ar=txt.match(/\[[\s\S]*\]/);if(ar)cand.push(ar[0]);
  cand.push(txt);
  for(const c of cand){
    try{
      const j=JSON.parse(c);
      if(Array.isArray(j))return {courses:[],tasks:j};
      if(j&&typeof j==='object')return j;
    }catch(e){}
  }
  throw new Error('模型返回的不是 JSON（可能模型不支持图片输入）');
}
function guessTaskType(name){
  if(/考试|测验|机考|补考/.test(name))return'考试';
  if(/实验|上机|实训|lab/i.test(name))return'实验';
  if(/答辩/.test(name))return'答辩';
  if(/项目|设计|大作业/.test(name))return'项目';
  if(/报告|论文|综述|读书笔记/.test(name))return'报告';
  if(/预习|阅读|文献|看书/.test(name))return'预习/阅读';
  if(/作业|习题|练习|提交/.test(name))return'作业';
  return'其他';
}

/* ================= AI 结果可编辑表单（大纲解析 / 图片识别共用） =================
   设计：AI 结果一旦落到页面上就变成「可编辑表单」，用户在导入前可以随便改。
   数据始终以「表单里的当前值」为准（读 DOM），不再依赖 __imgRes / __aiRes 的原始值。
   state 结构：{ tasks:[{...,subs:[{id,name}]}], courses:[...] }，各自挂在自己那个容器上。 */

/* —— 子任务行操作：改 / 删 / 上下移 / 新增 ——
   统一用 data 属性定位，避免把索引写死在 onclick 里（增删后索引会变）。 */
function aiSubMove(btn,dir){
  const row=btn.closest('.ai-sub-row');
  const box=row.parentNode;
  if(dir<0&&row.previousElementSibling)box.insertBefore(row,row.previousElementSibling);
  else if(dir>0&&row.nextElementSibling)box.insertBefore(row.nextElementSibling,row);
  else return;
  hydrateIcons(box);
}
function aiSubDel(btn){
  const row=btn.closest('.ai-sub-row');
  const box=row.parentNode;

function aiSubAdd(btn,boxId){

    <button type="button" class="btn ghost mini" title="下移" onclick="aiSubMove(this,1)"><i class="ic" data-ic="down"></i></button>
    <button type="button" class="btn danger ai-x" title="删掉这条" onclick="aiSubDel(this)">×</button>`;

/* 删掉整条任务（本次不导入）。勾选框同步取消，导入时自然跳过。 */
function aiDropTask(btn){
  const card=btn.closest('.ai-edit');
  if(!card)return;
  card.classList.add('off');
  const cb=card.querySelector('input[type=checkbox]');

function imgShowResult(courses,tasks){
  const exist=C=>{const k=String(C||'').trim().toLowerCase();return S.courses.find(c=>String(c.name).trim().toLowerCase()===k)};
  const plan=[];           // [{name,teacher,schedule,isNew}]
  (courses||[]).forEach(c=>{
    const nm=String(c&&c.name||'').trim();if(!nm||exist(nm))return;
    if(plan.some(x=>x.name.toLowerCase()===nm.toLowerCase()))return;
    plan.push({name:nm,teacher:String((c&&c.teacher)||'').trim(),schedule:String((c&&c.schedule)||'').trim(),isNew:true});
  });
  const entries=[];
  (tasks||[]).forEach(t=>{
    if(!t||!t.name)return;
    const nm=String(t.name).trim();
    let key=String(t.courseName||'').trim();
    if(!key){
      const hit=plan.find(x=>nm.indexOf(x.name)===0)||S.courses.find(c=>nm.indexOf(c.name)===0);
      key=hit?hit.name:(S.courses[0]?S.courses[0].name:(plan[0]?plan[0].name:''));
    }
    if(key&&!exist(key)&&!plan.some(x=>x.name===key))plan.push({name:key,teacher:'',schedule:'',isNew:true});
    entries.push({
      courseName:key||'未分类',
      name:nm,
      type:(TYPES.includes(t.type)?t.type:guessTaskType(nm)),
      weight:(+t.weight)||0,
      dueDate:(/^\d{4}-\d{2}-\d{2}$/.test(t.dueDate||'')?t.dueDate:S.semester.end),
      estHours:(+t.estHours)||4,

function imgApply(){
  if(!window.__imgRes){alert('没有可导入的内容，请先识别');return}
  // 课程：从表单读（用户可能改过名字 / 教师 / 时间）
  const cCards=[...document.querySelectorAll('#img-courses .ai-edit')];
  const cSel=cCards.filter(card=>{const cb=card.querySelector('input[type=checkbox]');return cb&&cb.checked});
  if(!cCards.length&&!document.querySelectorAll('#img-tasks .ai-edit').length){alert('什么都没识别到');return}
  const strip=!!($('#img-bind')&&$('#img-bind').checked);
  let nc=0,nt=0;
  const idOf={};
  const alias={};   // AI 给的原始课程名 → 实际课程名（用户改过名时要靠它把任务指对）
  S.courses.forEach(c=>idOf[c.name]=c.id);
  cSel.forEach(card=>{
    const name=(card.querySelector('.ic-f-name').value||'').trim();
    const orig=(card.dataset.orig||'').trim();
    if(!name)return;
    if(orig&&orig!==name)alias[orig]=name;
    if(idOf[name])return;
    const oc={id:uid(),name,color:PALETTE[S.courses.length%PALETTE.length],
      teacher:(card.querySelector('.ic-f-teacher').value||'').trim(),
      schedule:(card.querySelector('.ic-f-sched').value||'').trim(),syllabus:''};
    S.courses.push(oc);idOf[name]=oc.id;nc++;
  });
  const tCards=[...document.querySelectorAll('#img-tasks .ai-edit')];
  tCards.forEach(card=>{
    const cb=card.querySelector('input[type=checkbox]');
    if(cb&&!cb.checked)return;              // 取消勾选 / 点过「不导入」的都跳过
    const t=aiReadTask(card);
    if(!t.name)return;
    // 用户改过任务的课程下拉？优先用下拉的当前值；否则若原课程被改名了，跟着改名走
    const pick=card.querySelector('.ai-f-course');
    const chosen=pick?pick.value:t.courseName;
    let cName=(pick&&pick.value!==card.dataset.orig)?chosen:(alias[chosen]||chosen);
    // 任务挂到所选课程下；课程不在列表里就顺手建一个
    let cid=idOf[cName];
    if(!cid){
      const oc={id:uid(),name:cName||'未分类',color:PALETTE[S.courses.length%PALETTE.length],
        teacher:'',schedule:'',syllabus:''};
      S.courses.push(oc);idOf[oc.name]=oc.id;cid=oc.id;nc++;
    }
    let name=t.name;
    const cn=t.courseName||'';   // 用 AI 给的原始课程名判断前缀（用户改名不影响这条规则）
    if(strip&&cn&&name!==cn&&name.indexOf(cn)===0){
      const cut=name.slice(cn.length).replace(/^[\s\-—–:：|,，、]+/,'').trim();
      if(cut)name=cut;
    }
    S.tasks.push({id:uid(),courseId:cid,name,type:t.type||'其他',weight:t.weight||0,
      dueDate:t.dueDate||S.semester.end,estHours:t.estHours||4,startDate:'',notes:t.notes||'',
      dependencies:[],repeat:t.repeat||null,subtasks:t.subtasks.map(nm=>({id:uid(),name:nm,done:false})),
      done:false,manualProgress:0});
    nt++;
  });
  if(!nc&&!nt){alert('没有可导入的内容（可能都取消勾选了）');return}
  save();closeModal();
  toast('已导入 课程 '+nc+' 门 · 任务 '+nt+' 个');
  go('courses');
}

async function callAI(prompt){
  const a=S.settings.ai;
  if(MODE==='server'){
    // 走本机数据服务转发：由服务端代发请求，彻底绕开浏览器跨域限制
    const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({endpoint:a.endpoint,key:a.key,model:a.model,prompt,temperature:0.2})});
    if(!r.ok)throw new Error('本机数据服务返回 HTTP '+r.status);
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'解析失败');
    return pickJSON(j.content);
  }
  // 网页版（GitHub Pages）或没连上数据服务时：浏览器直连。
  // DeepSeek 接口实测允许浏览器跨域直连（2026-09-14 OPTIONS 预检验证），网页版 AI 功能可用
  let res;
  try{
    res=await fetch(a.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+a.key},
      body:JSON.stringify({model:a.model,messages:[{role:'user',content:prompt}],temperature:0.2})});
  }catch(e){
    throw new Error('浏览器直连 AI 接口失败（跨域拦截或网络不通）。DeepSeek 接口支持直连，请检查接口地址是否填对；其他不允跨域的接口请在电脑上用本地服务版');
  }
  if(!res.ok){
    let msg='接口返回 HTTP '+res.status;
    try{const ej=await res.json();if(ej&&ej.error&&ej.error.message)msg+='：'+ej.error.message}catch(e2){}
    throw new Error(msg);
  }
  const j=await res.json();
  return pickJSON(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content);
}
function pickJSON(content){
  let txt=String(content==null?'':content).replace(/```json|```/g,'').trim();
  const m=txt.match(/\[[\s\S]*\]/);if(m)txt=m[0];
  const arr=JSON.parse(txt);
  if(!Array.isArray(arr))throw new Error('接口没有返回任务列表，请检查模型名是否填对');
  return arr;
}
async function runAI(){
  const a=S.settings.ai;
  if(!a.key){alert('请先到「设置」页填写 AI 接口地址、Key 和模型');return}
  const c=S.courses.find(x=>x.id===$('#ai-course').value);
  const text=$('#ai-text').value.trim();
  if(!text){alert('请先粘贴大纲文本，或点「上传文件」导入 PDF/文档');return}
  if(!c.syllabus){c.syllabus=text;save()}
  $('#ai-run').disabled=true;$('#ai-run').textContent='解析中…';
  const prompt=`你是教务助理。下面是大学课程「${c.name}」的课程大纲。请提取所有硬性任务要求（考试、作业、实验、报告、项目、答辩、阅读等），输出严格的 JSON 数组，不要输出任何其他文字。字段：name(任务名),type(考试|作业|实验|报告|项目|答辩|预习/阅读|其他),weight(考核占比数字,没有则0),dueDate(YYYY-MM-DD,大纲没给就根据学期(${S.semester.start}至${S.semester.end})和常理推断,如期末考试放在学期末),estHours(预计投入小时数,数字;每周重复的任务填每次用时),repeat(该任务每周固定重复进行,如每周小测、每次上课都交作业,输出"weekly";一次性任务输出""),weekday(每周几,数字:0=周日,1=周一,2=周二…6=周六;仅repeat为weekly时输出),notes(硬性要求摘要,如闭卷、小组、字数要求等),subtasks(字符串数组,拆分的准备步骤)。

【subtasks 拆解要求（最重要）】这些子任务会直接变成学生每天的待办事项，所以必须拆成「当天能动手做完的具体动作」，而不是任务标题的换一种说法。
- 每条都要带动作动词 + 明确范围/数量，看完就知道要干什么、干完没有。
- 好的例子：「复习第 1-3 章并整理公式卡」「做完 2020-2023 共 4 套真题」「写出 300 字报告提纲」「背 50 个单词」。
- 反例（禁止）：「复习」「准备考试」「写报告」「做作业」——太笼统，无法判断做完没有。
- 按任务的真实工作量拆成 3-8 条，从准备、执行到收尾（提交/检查）覆盖完整过程，条与条之间不要重复。
- 顺序就是建议的推进顺序。

课程大纲：
${text.slice(0,6000)}`;
  try{
    const arr=await callAI(prompt);
    showAIResult(c,arr);
  }catch(e){
    const hint=MODE==='server'?'':'<br>若为跨域(CORS)限制，可把大纲发到 WorkBuddy 对话里由助手解析，再用「设置 → 导入任务 JSON」导入。';
    $('#ai-result').innerHTML=`<div class="tip" style="background:#fdeef2;border-color:#f7d4de;color:#c9566f">解析失败：${esc(e.message)}${hint}<br>可到「设置 → AI 解析设置」点「测试连接」，确认接口地址与 Key 是否正确。</div>`;
  }
  $('#ai-run').disabled=false;$('#ai-run').textContent='开始解析';
}

   kind: 'ai' 大纲解析（课程固定，不显示课程下拉） / 'img' 图片识别（可改课程、可删任务）

/* 从编辑卡片里读回一条任务（以用户改过的当前值为准） */
function aiReadTask(card){
  const g=s=>card.querySelector(s);
  const courseEl=g('.ai-f-course');
  const repEl=g('.ai-f-rep'),wdEl=g('.ai-f-wd');
  return{
    courseName:courseEl?courseEl.value:'',
    name:(g('.ai-f-name').value||'').trim(),
    type:g('.ai-f-type').value,
    weight:+g('.ai-f-weight').value||0,
    dueDate:g('.ai-f-due').value,
    estHours:+g('.ai-f-est').value||4,
    repeat:repEl&&repEl.value?{freq:repEl.value,weekday:wdEl?+wdEl.value:1}:null,
    notes:(g('.ai-f-notes').value||'').trim(),
    subtasks:[...card.querySelectorAll('.ai-sub-in')].map(x=>x.value.trim()).filter(Boolean)
  };
}

function applyAI(cid){
  const cards=[...document.querySelectorAll('#ai-cards .ai-edit')];
  if(!cards.length){alert('没有可导入的任务');return}
  let n=0;
  cards.forEach(card=>{
    const cb=card.querySelector('input[type=checkbox]');
    if(cb&&!cb.checked)return;              // 取消勾选 / 点过「不导入」的都跳过
    const t=aiReadTask(card);
    if(!t.name)return;
    S.tasks.push({id:uid(),courseId:cid,name:t.name,type:t.type||'其他',weight:t.weight||0,
      dueDate:t.dueDate&&/^\d{4}-\d{2}-\d{2}$/.test(t.dueDate)?t.dueDate:S.semester.end,
      estHours:t.estHours||4,startDate:'',notes:t.notes||'',dependencies:[],
      repeat:t.repeat||null,
      subtasks:t.subtasks.map(nm=>({id:uid(),name:nm,done:false})),done:false,manualProgress:0});

  });

  toast('已导入 '+n+' 个任务');

}
