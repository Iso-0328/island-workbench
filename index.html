/* ================= 动效层（GSAP） =================
   原则：渐进增强——GSAP 不可用时页面完全照常工作；
   尊重 prefers-reduced-motion；只动画 transform / opacity / SVG 属性，不动 layout 属性。 */
const FX=(()=>{
  const G=(typeof window!=='undefined'&&window.gsap)?window.gsap:null;
  const ST=(typeof window!=='undefined'&&window.ScrollTrigger)?window.ScrollTrigger:null;
  const on=!!G;
  let reduce=false,inRender=false,lastEnter=0;
  const all=(sel,root)=>{try{return Array.from((root||document).querySelectorAll(sel))}catch(e){return[]}};
  if(on){
    try{
      G.defaults({duration:.45,ease:'power2.out'});
      if(ST&&typeof window.matchMedia==='function')G.registerPlugin(ST);
      if(typeof G.matchMedia==='function'&&typeof window.matchMedia==='function')
        G.matchMedia().add({reduce:'(prefers-reduced-motion: reduce)'},c=>{reduce=!!c.conditions.reduce});
      // 蝴蝶结轻轻浮动 + 顶栏滑入（一次性）
      G.to('.logo .ic',{y:-3,duration:1.9,ease:'sine.inOut',repeat:-1,yoyo:true});
      G.from('header',{autoAlpha:0,y:-10,duration:.5});
    }catch(e){}
  }
  function killScroll(){if(ST)try{ST.getAll().forEach(t=>t.kill())}catch(e){}}
  // 进度条：scaleX 0→1（transform，不触发 layout）
  function bars(root){
    if(!on||reduce)return;
    all('.bar-mini>i,.pbar>i,.goal-bar>i',root).forEach(el=>{
      G.fromTo(el,{scaleX:0},{scaleX:1,duration:.75,ease:'power2.out',transformOrigin:'left center'});
    });
  }
  // 进度环：描边绘制动画
  function rings(root){
    if(!on||reduce)return;
    all('circle[stroke-dasharray]',root).forEach(el=>{
      const p=(el.getAttribute('stroke-dasharray')||'').trim().split(/[\s,]+/);
      if(p.length!==2)return;
      const c=parseFloat(p[1]);if(!c)return;
      G.fromTo(el,{attr:{'stroke-dasharray':'0 '+c}},{attr:{'stroke-dasharray':c+' '+c},duration:.9,ease:'power2.out',delay:.05});
    });
  }
  // 纯数字统计量从 0 滚动到目标值
  function nums(root){
    if(!on||reduce)return;
    all('.big',root).forEach(el=>{
      if(el.children.length)return;
      const m=(el.textContent||'').trim().match(/^(\d+)(%?)$/);
      if(!m)return;
      const to=+m[1];if(to<=0)return;
      const o={v:0};
      G.to(o,{v:to,duration:.9,ease:'power2.out',onUpdate:()=>{el.textContent=Math.round(o.v)+m[2]}});
    });
  }
  // 区块级入场（用于局部刷新：待办体、收入区）
  function enterInto(rootSel){
    if(!on)return;
    const root=(typeof rootSel==='string')?document.querySelector(rootSel):rootSel;
    if(!root)return;
    const cards=all('.card,.milestone',root);
    const rows=all('.todo-item,.task-row,.stage',root);
    if(reduce){bars(root);rings(root);nums(root);return}
    const tl=G.timeline({defaults:{duration:.4,ease:'power2.out'}});
    if(cards.length)tl.from(cards,{autoAlpha:0,y:12,stagger:.035,clearProps:'transform'},0);
    if(rows.length)tl.from(rows,{autoAlpha:0,x:-6,stagger:.02,clearProps:'transform'},.05);
    bars(root);rings(root);nums(root);
  }
  // 页面级入场：视口内的元素依次浮现，视口外的交给 ScrollTrigger 滚入时再出现
  function enterView(){
    if(!on)return;
    const now=Date.now();if(now-lastEnter<90)return;lastEnter=now;
    const v=(typeof document!=='undefined')&&document.getElementById('view');if(!v)return;
    killScroll();
    const kids=Array.from(v.children).filter(el=>el.tagName!=='SCRIPT');
    if(!kids.length)return;
    const vh=(typeof window!=='undefined'&&window.innerHeight)||800;
    const vis=el=>{const r=el.getBoundingClientRect();return r.top<vh*.94&&r.bottom>-30};
    const cards=all('.card',v),whole=kids.filter(el=>!el.classList.contains('card'));
    const inCards=cards.filter(vis),belowCards=cards.filter(el=>!vis(el));
    const inHeads=whole.filter(vis),belowHeads=whole.filter(el=>!vis(el));
    if(reduce){bars(v);rings(v);nums(v);return}
    const tl=G.timeline({defaults:{duration:.42,ease:'power2.out'}});
    if(inHeads.length)tl.from(inHeads,{autoAlpha:0,y:10,stagger:.05,clearProps:'transform'},0);
    if(inCards.length)tl.from(inCards,{autoAlpha:0,y:16,stagger:.055,clearProps:'transform'},.03);
    const below=belowCards.concat(belowHeads);
    if(below.length){
      if(ST)ST.batch(below,{start:'top 92%',once:true,onEnter:b=>G.from(b,{autoAlpha:0,y:16,duration:.45,stagger:.07,ease:'power2.out',clearProps:'transform'})});
      else G.from(below,{autoAlpha:0,y:12,stagger:.05,delay:.18,clearProps:'transform'});
    }
    bars(v);rings(v);nums(v);
  }
  // 单元素回弹（勾选、阶段圆点）
  function pop(el){if(on&&el&&!reduce)G.fromTo(el,{scale:.7},{scale:1,duration:.45,ease:'back.out(2.4)',clearProps:'scale'})}
  // 重渲染后按「同类元素序号」找回新节点做回弹 + 柔和高亮
  function popAfter(get){
    if(!on||reduce)return;
    setTimeout(()=>{
      const el=get();if(!el)return;
      pop(el);
      const row=el.closest('.todo-item,.task-row,.stage');
      if(row)G.fromTo(row,{backgroundColor:'#ffe4f0'},{backgroundColor:'rgba(255,255,255,0)',duration:.9,ease:'power1.out',clearProps:'backgroundColor'});
    },36);
  }
  // 存钱罐：金币依次掉落 + 罐体回弹 + 金额弹跳
  function coinBurst(){
    if(!on||reduce)return;
    setTimeout(()=>{
      const coins=all('.coin-fall');
      coins.forEach(c=>{c.style.animation='none'});
      if(coins.length)G.fromTo(coins,{y:-32,autoAlpha:0},{y:0,autoAlpha:1,duration:.55,stagger:.11,ease:'back.out(1.6)'});
      const pig=document.querySelector('.pig-wrap');
      if(pig)G.fromTo(pig,{scale:.96},{scale:1,duration:.65,ease:'elastic.out(1,0.45)',clearProps:'scale'});
      const tot=document.querySelector('#money-total');
      if(tot)G.fromTo(tot,{scale:.86},{scale:1,duration:.5,ease:'back.out(2)',clearProps:'scale'});
    },36);
  }
  if(on){
    // 事件委托：勾选框 / 阶段圆点 / 页签 的轻反馈
    document.addEventListener('click',e=>{
      const t=e.target;
      if(!t||!t.closest)return;
      const chk=t.closest('.chk');
      if(chk){const i=all('.chk').indexOf(chk);popAfter(()=>all('.chk')[i]);return}
      const dot=t.closest('.stage-dot');
      if(dot){const i=all('.stage-dot').indexOf(dot);popAfter(()=>all('.stage-dot')[i]);return}
      const tab=t.closest('nav button');
      if(tab){const i=all('nav button').indexOf(tab);setTimeout(()=>{const el=all('nav button')[i];if(el&&!reduce)G.fromTo(el,{scale:.93},{scale:1,duration:.4,ease:'back.out(2.2)',clearProps:'scale'})},36)}
    },true);
  }
  return {
    on,enterView,enterInto,coinBurst,pop,
    mark(){inRender=true},unmark(){inRender=false},
    get busy(){return inRender},
    get reduce(){return reduce}
  };
})();

init();
</script>
